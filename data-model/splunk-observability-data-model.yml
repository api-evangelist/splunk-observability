note: Derived from the request/response schemas of the reconstructed specs. Splunk publishes no object
  reference with id prefixes, so entity identity is expressed through the id-bearing fields the schemas
  actually carry rather than through documented prefixes. Every Splunk Observability Cloud object ID is
  an opaque base64-ish string (for example ABCDEFGHIJK) with no type prefix — an agent cannot tell a chart
  ID from a detector ID by looking at it, which is the single most important fact in this file.
id_convention:
  prefixed: false
  shape: opaque base64-style string, typically 11 characters
  examples:
  - ABCDEFGHIJK (detectorId)
  - BCDEFGHIJKL (incidentId)
  - ChkVxy0AEAA (SignalFlow job handle)
  - CgrT2EkAAAA (tsId)
  implication: IDs are not self-describing. Track the type alongside the ID; a wrong-type ID returns 404,
    not a 400.
