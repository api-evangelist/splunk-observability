  name: Splunk Observability Cloud MCP Server
  description: >-
    Hosted Model Context Protocol server for Splunk Observability Cloud, using the streamable HTTP transport.
    Twelve tools across metrics/SignalFlow, APM and alerting. Authenticated with X-SF-REALM and X-SF-TOKEN
    headers; tools/list returns HTTP 401 unauthenticated.
  humanURL: >-
    https://help.splunk.com/en/splunk-observability-cloud/splunk-ai-assistant/interact-with-your-observability-data-using-the-splunk-mcp-server
  baseURL: https://region-pdx10.api.scs.splunk.com/system/mcp-gateway/v1/
