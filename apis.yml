aid: splunk-observability
name: Splunk Observability Cloud
description: 'Splunk Observability Cloud is the observability platform Splunk built on SignalFx, now part of Cisco:
  infrastructure monitoring, APM, real user monitoring, synthetics, log observer and incident response over OpenTelemetry-native
  ingest. It is the largest documented API surface Splunk operates — the developer site enumerates forty-eight distinct
  OpenAPI specifications covering charts, dashboards, detectors, SignalFlow, SLOs, org tokens, teams and twenty
  synthetics endpoints. None of them is fetchable: dev.splunk.com answers HTTP 200 with an identical 6,638-byte
  single-page-application shell for every path, including invented control paths, so the entire contract surface
  is readable by people and invisible to machines.'
