aid: splunk-observability
name: Splunk Observability Cloud
description: 'Splunk Observability Cloud is the observability platform Splunk built on SignalFx and now runs as
  part of Cisco: infrastructure monitoring, APM, real user monitoring, synthetics, Log Observer and incident response
  over OpenTelemetry-native ingest. Its control plane is the largest API surface Splunk operates — 48 OpenAPI documents
  and 242 operations covering charts, dashboards, detectors, incidents and muting rules, metrics and dimension metadata,
  SignalFlow, SLOs, org and session tokens, teams, integrations and twenty distinct Synthetics services — alongside
  a SignalFlow WebSocket/SSE streaming interface and a hosted MCP server for agents. Authentication is a single
  X-SF-TOKEN header, the realm is part of the hostname, and Splunk publishes no downloadable spec file: the contract
  is embedded in its own reference pages.'
url: https://raw.githubusercontent.com/api-evangelist/splunk-observability/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
position: Consumer
x-type: company
x-source: cisco-family-buildout:2026-08-19
x-parent: splunk
x-relationship: product
x-contract-status: reconstructed
x-contract-note: Splunk serves no fetchable spec file — dev.splunk.com answers 200 with an identical 6,638-byte
  shell for every asset path including invented controls. But each of its 48 API reference pages embeds Splunk's
  own OpenAPI object in the React Server Component payload, and all 48 (242 operations) were extracted from there.
  The operations and schemas are Splunk's; the assembly is API Evangelist's. Graded as NOT first-party.
