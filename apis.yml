- aid: splunk-observability:splunk-observability-apm-visibility-filters-api
  name: Splunk Observability Cloud APM visibility filters
  description: APIs to manage visibility filters on indexed and unindexed span tags in Splunk APM. These filters
    identify and hide span tag values that might contain sensitive data from everywhere in Splunk APM. Note that
    the tags are hidden rather than purged; information is not purged from Splunk APM until it expires after the
    8-day default retention period.
