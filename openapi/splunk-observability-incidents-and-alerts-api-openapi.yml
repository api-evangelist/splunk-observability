  /incident/{id}/clear:
    put:
      summary: Clear Single Incident
      description: 'Manually clears the incident identified by the

        incident ID specified in the {id} path parameter.

        This API can be used with incidents created by a detector you add

        using the UI or a detector you add using the API (a v2

        detector).

        This operation doesn''t return a response body.'
      parameters:
      - name: id
        in: path
        description: The id of an existing incident that you want to clear
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
      security:
      - SessionToken: []
      tags:
      - Incidents and alerts
  /incident/clear:
    put:
      summary: Clear Incidents
      description: Clears alerts identified by the rules in the request body.
      parameters:
      - name: Content-Type
        in: header
        description: Format of the request body. Always "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      NOT:
                        type: boolean
                        default: false
                        description: 'Flag that controls the rule results. If true, the filter

                          does a not equals comparison. Otherwise, the filter does an

                          equals comparison. The default is false.'
                      property:
                        type: string
                        minLength: 1
                        description: 'Dimension or custom property name (key) of a signal

                          or signals that triggered an incident, in the form of a JSON string'
                      propertyValue:
                        type: array
                        minItems: 1
                        items:
                          oneOf:
                          - type: number
                          - type: string
                            minLength: 1
                          - type: boolean
                        description: 'List of values that the API compares to the value of property, in

                          the form of a JSON array. Each element can be a JSON number, string,

                          or boolean.'
                    example: "{\n  \"NOT\": false,\n  \"property\": \"aws_availability_zone\",\n  \"propertyValue\": [\n    \"us-east-1a\"\n  ]\n}\n"
                    title: IncidentClearRule
                    description: 'Single clear incident rule, in the form of a JSON object. A rule selects

                      incidents by comparing a signal property to one or more values. If

                      Splunk Observability Cloud finds a match, it it clears the incidents that the signal triggered.

                      The NOT property tells the API to reverse the rule results:


                      NOT is false: Rule matches if the property is equal to any of the specified values

                      NOT is true: Rule matches if the property is equal to none

                      of the specified values or if the property doesn''t exist'
                  description: 'List of rules that identify one or more incidents, in the form

                    of a JSON array. Each array element specifies a single rule.'
              example: "filters: [\n{\n  \"NOT\": false,\n  \"property\": \"aws_availability_zone\",\n  \"propertyValue\": [\n    \"us-east-1a\"\n  ]\n},\n{\n  \"NOT\": true,\n  \"property\": \"demo_test_host\",\n  \"propertyValue\": [ true ]\n}\n]\n"
              title: IncidentClearRules
              description: Rules that identify one or more incidents you want to clear.
            examples:
              example:
                value: "filters: [\n{\n  \"NOT\": false,\n  \"property\": \"aws_availability_zone\",\n  \"propertyValue\": [\n    \"us-east-1a\"\n  ]\n},\n{\n  \"NOT\": true,\n  \"property\": \"demo_test_host\",\n  \"propertyValue\": [ true ]\n}\n]\n"
      responses:
        '201':
          description: HTTP 201 response
        '400':
          description: HTTP 400 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP response code, always 400
                  message:
                    type: string
                    description: Human-readable text string
              examples:
                default:
                  value: "{\n  \"code\": 400,\n  \"message\": \"Failed to deserialize payload at: sf.rest.shared.model.incident.ClearMultipleIncidentsRequest[\\\"filters\\\"]->java.util.ArrayList[0]->sf.rest.shared.model.PropertyFilter[\\\"propertyValue\\\"]\"\n}\n"
        '401':
          description: HTTP 401 response
          content:
            application/json:
              schema:
                type: string
              examples:
                default:
                  value: '"Invalid token specified."

                    '
      security:
      - SessionToken: []
      tags:
      - Incidents and alerts
components:
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-SF-Token
      description: Splunk Observability Cloud session token or org access token.
