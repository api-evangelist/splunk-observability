  /incident:
    get:
      summary: Retrieve Incidents
      description: 'Retrieves information for the latest incidents in an organization, one incident from each ETS. This endpoint retrieves

        incidents created by detectors you add in the UI and detectors you add using the API.

        Note: Splunk Observability Cloud returns a maximum of 10,000 incidents, even if your organization contains more than 10,000. To learn more, see the

        Considerations for retrieve operations section in the developer guide.'
      parameters:
      - name: includeResolved
        in: query
        description: 'Specifies which latest incidents to retrieve based on their status. If

          the value is true, the API returns latest incident for which the status

          is "resolved"; otherwise, the API only returns the latest active incidents.'
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        description: The number of results to return from the result set.
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: 'The result object in the result set at which the API should start

          returning results to you. If omitted, the API starts at the first

          result in the set.'
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        description: 'Controls which latest incidents to retrieve, based on descriptions and other filters. For example, to retrieve the latest incidents created by detectors linked to a team with the ID FO1Vq3ABXYZ, specify teamId:FO1Vq3ABXYZ.

          To search for latest incidents by specific values of a dimension or custom property, use query=<name>:<value>. If <value> contains non-alphanumeric characters, encode the non-alphanumeric characters and surround the value with double quotes. For example, the region custom property value US East must be passed in the parameter as region:"US%20East".

          Here are examples of the query parameter used alone and with other available query parameters:


          https://app.{realm}.observability.splunkcloud.com/v2/incident?query=teamId:FO1Vq3ABXYZ

          https://app.{realm}.observability.splunkcloud.com/v2/incident?query=region:"US%20East"&limit=5&offset=5


          For information about how to link detectors to teams, see Detectors linked to teams.'
        schema:
          type: string
