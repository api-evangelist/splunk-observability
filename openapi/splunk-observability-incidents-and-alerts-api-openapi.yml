                        anomaly, triggered an alert, generated an alert event, and sent a notification.

                        "MANUALLY_RESOLVED": User resolved the incident in the UI or by

                        calling PUT /incident/{id}/clear.

                        "OK": Splunk Observability Cloud detected that the anomaly had cleared and issued a

                        clear event for the incident.

                        "STOPPED": User updated the detector and restarted the detector job'
                    detectLabel:
                      type: string
                      readOnly: true
                      title: DetectLabel
                      description: 'The label of the SignalFlow program for the detector that generated

                        an event or the events in an incident.

                        This property is read-only.'
                    detectorId:
                      type: string
                      readOnly: true
                      title: DetectorId
                      description: 'The ID of the detector that generated an

                        event or events in an incident

