  /dashboardgroup/{id}/dashboard:
    post:
      summary: Clone Dashboard to Group
      description: 'Note: This operation doesn''t create a mirrored dashboard. Use

        PUT dashboardgroup/{id} to add a mirrored dashboard to a

        group.

        Creates a new v2 dashboard from an existing dashboard and

        associates it with the dashboard group specified by the {id} path

        parameter. The new dashboard is an exact copy of the existing dashboard,

        but you can change its name, description, and filters by specifying them

        in your request.

        If the write permissions feature is available in

        your organization, you need to have write permission for the dashboard

        group into which you''re cloning the dashboard.

        If you don''t have write permissions for the dashboard you''re cloning,

        Splunk Observability Cloud sets the dashboard permissions on the cloned dashboard so that

        any user can edit it.'
      parameters:
      - name: id
        in: path
        description: ID of an existing dashboard group
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Format of the request body. Always  "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sourceDashboard
              properties:
                description:
                  type: string
                  title: DashboardDescription
                  description: Description of a cloned dashboard
                filters:
                  title: Filters to apply to all the charts of the cloned dashboard
                  type: object
                  properties:
                    sources:
                      type: array
                      items:
                        title: Filter to apply to charts in a dashboard
                        type: object
                        required:
                        - property
                        - value
                        properties:
                          NOT:
                            type: boolean
                            default: false
                            description: 'Flag that indicates how the filter should operate. If true, data

                              that matches the criteria is excluded from charts; otherwise, data

                              that matches the criteria is included.'
                          property:
                            type: string
                            description: 'Name of the dimension or custom property to match to the data

                              Note: If the dimension or custom property doesn''t exist in any

                              of the charts for the dashboard, and ChartsFilter.NOT is true,

                              the system doesn''t display any data in the charts.'
                          value:
                            type: array
                            items:
                              type: string
                            description: 'A list of values to compare to the value of the dimension or custom

                              property specified in ChartsFilter.property. If the list contains

                              more than one value, the filter becomes a set of queries between the

                              value of property and each element of value. The system joins

                              these queries with an implicit OR.'
                        description: 'A single filter object to apply to the charts in the dashboard. The

                          filter specifies a default or user-defined dimension or custom property.

                          You can either include or exclude all the data that matches the

                          dimension or custom property.'
                      description: 'List of filter objects to apply to the charts in the dashboard.

                        Each object specifies a single filter for a default or user-defined

                        dimension or custom property.'
                    time:
                      type: object
                      properties:
                        end:
                          type: string
                          description: 'The end of the time range to show for all charts in the

                            dashboard. If you don''t specify a value for this property, the

                            system defaults to the value for each chart''s end

                            property.

                            Note: The specified type for end is string, but the

                            system also accepts a 64-bit signed integer >= 0 that represents a

                            timestamp in *nix time in milliseconds.'
                        start:
                          type: string
                          description: 'The start of the time range to show for all charts in the

                            dashboard. If you don''t specify a value for this property, the

                            system defaults to the value for each chart''s start

                            property

                            Note: The specified type for start is

                            string, but the system also accepts a 64-bit signed integer >= 0

                            that represents a timestamp in *nix time in milliseconds.'
                      description: 'Time range to show in all of the charts in the dashboard. The

                        specifications in this object override those in each individual

                        chart. If you don''t specify values, the system defaults to using the

                        individual time setting for each chart.'
                    variables:
                      type: array
                      items:
                        title: Filter that appears in the UI
                        type: object
                        required:
                        - property
                        - value
                        properties:
                          alias:
                            type: string
                            description: 'A label for the filter. The system displays this label in the area

                              preceding the input textarea for the filter in the UI.

                              Note: A good way to indicate that the string is a label is to

                              append a space and a colon (":") to it.'
                          preferredSuggestions:
                            type: array
