    delete:
      summary: Delete Single Dashboard Group
      description: 'Deletes the dashboard group specified by the {id} path parameter.

        Dashboards associated with the group are affected as follows:


        If the mirrored dashboard feature isn''t available in your organization:

        Deleting the dashboard group deletes all the dashboards associated with

        the group.


        If the mirrored dashboard feature is available in your organization:

        If dashboards in the group are mirrored in other groups, then deleting

        the dashboard group doesn''t delete the dashboards.

        If dashboards in the group aren''t mirrored in other groups, then

        deleting the dashboard group deletes the dashboards.'
      parameters:
      - name: id
        in: path
        description: ID of an existing dashboard group.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: 'Format of the request payload. The only allowed value is

          "application/json".'
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
      security:
      - SessionToken: []
      tags:
