    put:
      summary: Update Single Dashboard Group
      description: 'Updates the dashboard group specified by the {id} path parameter,

        using the properties specified in the request body

        This operation has overwrite semantics. Values you specify in the

        request body overwrite existing properties. The API either removes or

        resets properties that you don''t specify. Some values you can specify

        for mirrored dashboard overrides have special meaning:


        Arrays you specify for to the authorizedWriters, dashboards,

        dashboardConfigs, and teams array properties overwrite the

        existing arrays.

        To add an element to an array, retrieve the existing dashboard group,

        copy the array, insert into the copy the element you want to add,

        and send the copy in your PUT request.

        To add a dashboard mirror, update the dashboardConfigs array

        with a dashboardConfig that contains an existing dashboard ID.

        If the write permissions feature is enabled for your organization,

        the user ID associated with the request''s auth token must have write

        permission for the group.'
      parameters:
      - name: id
        in: path
        description: ID of the dashboard group you want to update
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Format of the request body. Always  "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorizedWriters:
                  title: Organizations and teams with write permission for an object
                  type: object
                  properties:
                    teams:
                      type: array
                      items:
                        type: string
                      description: 'List of team IDs that have write access to the group, in the form of

                        a JSON array'
                    users:
                      type: array
                      items:
                        type: string
                      description: Array of user IDs that have write access to the group
                  description: 'Set of organizations and teams that have write permission for the

                    dashboard group, in the form of a JSON object. If your organization has

                    the write permissions feature enabled, you can use this object to

                    specify the user and team IDs that have write access to the dashboard

                    group'
                dashboards:
