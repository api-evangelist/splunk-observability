                            description: 'List of strings containing values to place at the top of the

                              Suggested Values dropdown in UI for the dashboard, in the

                              form of a JSON array. If ChartsWebUIFilter.restricted is true,

                              the filter must use one of the values in the list; users only have a

                              choice of selecting a value from this list.'
                          property:
                            type: string
                            description: 'Name of a custom property or dimension to filter against.

                              Note: If the dimension or custom property doesn''t exist in any

                              of the charts for the dashboard, the system doesn''t display any

                              data in the charts.'
                          required:
                            type: boolean
                            default: false
                            description: 'Flag that controls the display of chart data. If true, users must

                              use this filter in order to see data; otherwise, users can delete

                              the filter.'
                          restricted:
                            type: boolean
                            default: false
                            description: 'Flag that controls the values allowed in the filter. If true, the

                              only allowable values are those specified in the

                              ChartsWebUIFilter.preferredSuggestions array; otherwise, any value

                              is allowed.'
                          value:
                            type: array
                            items:
                              type: string
                            description: 'A list of values to compare to the value of the dimension or custom

                              property specified in ChartsWebUIFilter.property. If the list

                              contains more than one value, the filter becomes a set of queries

                              between the value of property and each element of value. The

                              system joins these queries with an implicit OR.'
                        description: 'The specification for a filter that appears in the UI. The filter

                          compares the value of a dimension or custom property to a value

                          specified in this filter. You can specify the following in the

                          filter:


                          A default value

                          A list of suggested values to display in the UI

                          A flag that controls user input; if set to true, users are limited

                          to the default and suggested values.


                          You can also force users to choose this filter in order to see data in

                          the dashboard''s charts.'
                      description: 'List of UI-oriented filters that appear at the top of the

                        dashboard, in the form of a JSON array. For each filter you can

                        specify a name and a label for the dimension or custom property to

                        filter against, a list of suggested comparison values to display in

                        the UI, and other properties that control the UI display. To

                        see a more detailed description of the options, refer to the

                        property descriptions for the ChartsWebUIFilter model.'
                  description: 'Specifies the properties of filters to apply to the cloned dashboard.

                    This is an optional property that you only need to use if you

                    want to override the filters property of the dashboard you''re cloning.

                    Filters give you fine-grained control over the data displayed in the

                    charts in the dashboard. You can specify ad hoc filters or save them

                    as variables for repeated use of the filter criteria.

                    You can also use filters to apply a custom time window to all of the charts in the

                    dashboard.'
                name:
                  type: string
                  title: DashboardName
                  description: 'A human-readable label for the dashboard. The UI displays this label

                    in the dashboard''s group.'
                sourceDashboard:
                  title: Dashboard ID of a cloned dashboard
                  type: string
                  description: 'The ID of the dashboard to clone into the dashboard group whose ID is

                    specified in the {id} path parameter'
            examples:
              example:
                value:
                  description: string
                  filters:
                    sources:
                    - NOT: true
                      property: string
                      value:
                      - string
                    time:
                      end: string
                      start: string
                    variables:
                    - alias: string
                      preferredSuggestions:
                      - string
                      property: string
                      required: true
                      restricted: true
                      value:
                      - string
                  name: string
                  sourceDashboard: string
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the new dashboard.
              examples:
                example:
                  value:
                    id: string
        '400':
          description: HTTP 400 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: HTTP response code. Always '400'
                  message:
                    type: string
                    description: Error explanation
              examples:
                example:
                  value:
                    code: 0
                    message: string
      security:
      - SessionToken: []
      tags:
      - Dashboard groups
components:
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-SF-Token
      description: Splunk Observability Cloud session token or org access token.
