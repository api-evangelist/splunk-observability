      security:
      - SessionToken: []
      tags:
      - Charts
    delete:
      summary: Delete Single Chart
      description: Deletes the chart identified by the chart ID in the id path parameter.
      parameters:
      - name: id
        in: path
        description: The ID of the chart you want to update
        required: true
        schema:
          type: string
      - name: X-SF-Token
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
      security:
      - SessionToken: []
      tags:
      - Charts
