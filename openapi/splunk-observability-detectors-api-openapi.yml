                  readOnly: false
                  writeOnly: false
                  items:
                    type: string
                    maxLength: 256
                    maxItems: 50
                    readOnly: false
                    writeOnly: false
                    description: 'UTF-8 string, starting with an uppercase or lowercase alphabetic character.

                      The maximum length is expressed in characters; if a string consists solely

                      of single-byte UTF-8 entities, 1024 characters are available.'
