  /detector/{id}/events:
    get:
      summary: Retrieve Events Single Detector
      description: 'Retrieves the events generated by the detector identified by the id

        path parameter.

        Note: Splunk Observability Cloud returns a maximum of 10,000 events, even if your organization contains more than 10,000. To learn more, see the

        Considerations for retrieve operations section in the developer guide.'
      parameters:
      - name: id
        in: path
        description: 'The ID of the detector that generated the events

          you want to retrieve.'
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: 'The starting timestamp, inclusive, of the range of events you want

          to retrieve, in *nix time in milliseconds.'
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        description: 'The ending timestamp, inclusive, for the time range of events you

          want to retrieve, in *nix time in milliseconds.'
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: 'The index in the query results at which you want to start getting

          results'
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        description: Number of query results to return. By default, the API returns 50 detector events. If you want to retrieve a different number of detector events, change the limit value.
        schema:
          type: integer
          format: int32
          default: 50
          minimum: 0
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                title: Events for a detector
                type: array
                items:
                  title: Single event for a detector
                  type: object
                  properties:
                    anomalyState:
                      type: string
                      enum:
                      - ANOMALOUS
                      - MANUALLY_RESOLVED
                      - OK
                      - STOPPED
                      readOnly: true
                      title: AnomalyState
                      description: 'Describes the current anomaly state of an event or incident, in the

                        form of a JSON string that describes the current signal status compared

                        to its expected state. This property is read-only. The possible

                        values are:


                        "ANOMALOUS": Based on detector settings, Splunk Observability Cloud detected an

                        anomaly and issued events in this incident.

                        "MANUALLY_RESOLVED": User resolved the incident in the UI or by

                        calling PUT /incident/{id}/clear.

                        "OK": Based on the detector settings, Splunk Observability Cloud detected that the

                        anomaly had cleared and issued a clear event for the incident.

                        "STOPPED": User updated the detector and restarted the detector job'
                    detectLabel:
                      title: Publish object label
                      type: string
                      example: loadWarning
                      description: 'Label of the publish object for the detector that generated this event.

                        The publish object is the part of the detector''s SignalFlow program

                        that publishes the results of the detect(). The object is created by

                        a publish(<label>), and detectLabel is set to the value of <label>.'
                    detectorId:
                      title: Detector system ID
                      type: string
                      readOnly: true
                      description: 'ID of a detector. When you retrieve events

                        or incidents for a detector, this ID is for the detector that

                        generated the event or incident.

                        This property is read-only; it''s always set by the system.'
                    detectorName:
                      title: Detector name (displayed)
                      type: string
                      minLength: 1
                      readOnly: false
                      writeOnly: false
                      example: JVM CPU Load detector
                      description: 'Displayed name of the detector in the UI. When you

                        retrieve events or incidents, this property contains the name of the

                        associated detector.'
                    event_annotations:
                      type: object
                      readOnly: true
                      description: 'Reserved for internal use .

                        This property is read-only; it''s always set by the system.'
                    id:
                      title: ID for an event
                      type: string
                      readOnly: true
                      description: 'ID for an event generated by a detector.

                        This property is read-only; it''s always set by the system.'
                    incidentId:
                      title: ID of an incident
                      type: string
                      readOnly: true
                      description: 'ID of an incident that represents the

                        trigger and clear events generated by a detector.

                        This property is read-only; it''s always set by the system.'
                    inputs:
                      title: Inputs to detector's detect object
                      type: object
                      additionalProperties: null
                      example:
                        A: 5
                        B: 6
                      description: 'Inputs to a detector''s detect block, in the form of a JSON object.

                        A detector''s detect block is the part of its SignalFlow program that

                        contains the detect() function call.

                        The top-level keys in the object may be internal Splunk Observability Cloud variables,

                        or they may be metric names. The values may be objects or primitives,

                        depending on the structure of the detect block.'
                    severity:
                      type: string
                      format: Capitalized
                      enum:
                      - Critical
                      - Warning
                      - Major
                      - Minor
                      - Info
                      example: Info
                      readOnly: false
                      writeOnly: false
                      title: Severity
                      description: 'Indicates the severity of a triggered alert. You can assign your own

                        semantics to each severity level. To see the available values,  refer to

                        the enum specification.

                        Note: The allowed values for Severity

                        are enums, so you must enter them with the first letter in uppercase and

                        all other letters lowercase.

                        The PagerDuty alerting service maps

                        Splunk Observability Cloud severity values to PagerDuty service values as follows

                        (Splunk Observability Cloud values are at the beginning of the line):


                        Critical → Critical

                        Major → Critical

                        Minor → Error

                        Warning → Warning

                        Info → Info'
                    timestamp:
                      title: Time that an event occurred
                      type: integer
                      format: int64
                      readOnly: true
                      description: 'Date and time that an event occurred, in *nix time in milliseconds.

                        This property is read-only; it''s always set by the system.'
                  description: 'Properties of a single event for a detector, in the form of a JSON

                    object'
                description: 'Result of retrieving events for a detector using

                  GET /detector/{id}/events, in the form of an array of

                  JSON objects containing events.'
              examples:
                example:
                  value:
                  - anomalyState: ANOMALOUS
                    detectLabel: loadWarning
                    detectorId: string
                    detectorName: JVM CPU Load detector
                    id: string
                    incidentId: string
                    inputs:
                      A: 5
                      B: 6
