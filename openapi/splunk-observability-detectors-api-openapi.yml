      description: 'Deletes the detector specified by the {id} path parameter.

        Note: When you delete a detector, Splunk Observability Cloud stops the SignalFlow program associated with the detector and sends a stop notification to all the recipients currently configured for the detector.

        For detectors with a large number of recipients or a large number of alerts, to avoid sending out stop notifications, delete all the recipients from the detector before you delete the detector. When the detector has no recipients, Splunk Observability Cloud doesn’t send out any notification.'
