                    Note: You can have no more than 50 tags per detector.'
                teams:
                  title: Team IDs for this detector
                  type: array
                  readOnly: false
                  writeOnly: false
                  items:
                    type: string
                    readOnly: false
                    writeOnly: false
                  example:
                  - DevOps
                  - Engineering
                  - Support
                  description: 'IDs of teams associated with this detector. The teams

                    associated  with a detector can see the detector and its active alerts

                    on the team''s landing page in the UI. The list of teams associated

                    with a detector is independent of notification settings.  Teams

                    specified in this field don''t automatically get notified of new alerts,

                    and teams that choose to get alerts do not have to display the detector

                    on their team landing page in the web application.'
                timezone:
                  title: Time zone for SignalFlow calendar window transformations
                  type: string
                  default: UTC
                  readOnly: false
                  writeOnly: false
                  example: America/Detroit
                  description: 'Specifies which time zone SignalFlow should use as the basis of calendar

                    window transformation methods. For example, if you set "timezone": "Europe/Paris" and then use the transformation sum(cycle="week", cycle_start="Monday") in your detector''s SignalFlow program, the

                    calendar window starts on Monday, Paris time.

                    For a list of supported time zones,

                    see Time zone for calendar window transformations.'
                visualizationOptions:
                  title: Detector appearance options
                  type: object
                  properties:
                    disableSampling:
                      type: boolean
                      default: false
                      readOnly: false
                      writeOnly: false
                      example: false
                      description: 'If true, Splunk Observability Cloud displays all data points in the detect()

                        streams; otherwise, Splunk Observability Cloud only samples data points. Using sampling

                        improves performance.'
                    publishLabelOptions:
                      title: List of display options for the detector's chart
                      type: array
                      items:
                        title: Display options for the detector's chart
                        type: object
                        properties:
                          displayName:
                            title: Detector chart display name
                            type: string
                            example: JVM CPU load
                            description: 'Specifies the Data Table column header for a single publish() block

                              in a detector''s chart. If you don''t specify a value, Splunk Observability Cloud uses the

                              name of the dimension that''s providing the data for the publish()

                              block.'
                          label:
                            title: Label of a publish() object in a SignalFlow program
                            type: string
                            example: cpuLoad
                            description: 'Specifies a SignalFlow publish() object label. Splunk Observability Cloud uses this value

                              to associate the publish() block output with a publishLabelOptions

                              object.'
                          paletteIndex:
                            title: Color choice
                            type: integer
                            minimum: 0
                            maximum: 15
                            example: 9
                            description: '0-based index into the color table displayed in

                              Charts color palettes.

                              Only the first 16 entries (0-15) are allowed for this value. Splunk Observability Cloud uses the

                              index to determine which color to use for displaying the output of a single publish()

                              object in a detector''s table.'
                          valuePrefix:
                            title: String to prepend to data table values
                            type: string
                            example: 'Avg '
                            description: 'Specifies a string to prepend to the value in a data table for

                              a detector''s chart. This string also appears in the tooltip you see

                              when you hover over a point on a chart. To learn more, see the

                              example in Single value charts.

                              Splunk Observability Cloud overrides valuePrefix if you set options.publishLabelOptions.valueUnit for the same

                              plot.'
                          valueSuffix:
                            title: String to append to detector chart's data table values
                            type: string
                            example: pct
                            description: 'Specifies a string to append to the value in the data table for a

                              detector''s chart. This string also appears in the tooltip you see when

                              you hover over a point in the chart. To learn more, see the

                              example in Single value charts.

                              Splunk Observability Cloud overrides valueSuffix if you set options.publishLabelOptions.valueUnit

                              for the same plot.'
                          valueUnit:
                            title: Display units used with the detector's chart
                            type: string
                            enum:
                            - Bit
                            - Kilobit
                            - Megabit
                            - Gigabit
                            - Terabit
                            - Petabit
                            - Exabit
                            - Zettabit
                            - Yottabit
                            - Byte
                            - Kibibyte
                            - Mebibyte
                            - Gibibyte
                            - Tebibyte
                            - Pebibyte
                            - Exbibyte
                            - Zebibyte
                            - Yobibyte
                            - Nanosecond
                            - Microsecond
                            - Millisecond
                            - Second
                            - Minute
                            - Hour
                            - Day
                            - Week
                            example: Second
                            description: 'Specifies the units of measure for values displayed in a detector''s chart.

                              Splunk Observability Cloud assumes that the raw data uses the unit of measure you select.

                              For example, the value 1000 in a chart where you''ve set

                              options.publishLabelOption.valueUnit to bits appears as 1 Kilobit,

                              and the value 1024 in a plot set to Bytes appears as 1 Kebibyte.

                              Splunk Observability Cloud scales units within their own unit type. Refer to

                              Display units and other labels

                              for a full specification. The options.publishLabelOptions.valueUnit option applies to scaling

                              and labeling in chart tooltips, axes, and data tables. If

                              options.publishLabelOptions.valueUnit affects the chart

                              presentation, it overrides options.publishLabelOptions.valuePrefix and

                              options.publishLabelOptions.valueSuffix.'
                        description: 'One set of options that control the appearance of a publish() block

                          in a detector''s chart, in the form of a JSON object. Splunk Observability Cloud matches the

                          objects label value to match it to its publish() block.'
                      description: 'List of display options for a detector''s chart. Each element in the list

                        contains the options for a single SignalFlow publish() block in the

                        detector''s SignalFlow program. The list has the form of a JSON array of

                        objects.

                        Splunk Observability Cloud matches an object''s label value to match it to a publish()

                        block.'
                    showDataMarkers:
                      type: boolean
                      default: true
                      readOnly: false
                      writeOnly: false
                      example: true
                      description: If True, visualizations contain markers for each data point.
                    showEventLines:
                      type: boolean
                      default: false
                      readOnly: false
                      writeOnly: false
                      example: true
                      description: 'If True, the visualization contains a vertical line at the time

                        value that  the detect() function triggers an alert.'
                    time:
                      title: Time Object
                      type: object
                      properties:
                        end:
                          type: integer
                          format: int64
                          default: 0
                          example: 1557693030000
                          readOnly: false
                          writeOnly: false
                          description: 'The timestamp of the last time to display in the visualization,

                            specified in *nix time in milliseconds.'
                        range:
                          type: integer
                          format: int64
                          minimum: 0
                          default: 0
                          readOnly: false
                          writeOnly: false
                          example: 0
                          description: 'The number of milliseconds to display in the visualization. This is

                            a is a rolling range with the current time at the right border of

                            the chart display. Use 0 to use the default behavior; this

                            corresponds to -15m for most metrics and -1h for AWS, GCP, and Azure

                            metrics.'
                        start:
                          type: integer
                          format: int64
                          minimum: 0
                          default: 0
                          example: 1557682230000
                          readOnly: false
                          writeOnly: false
                          description: 'The timestamp of the first time to display in the visualization,

                            specified in *nix time in milliseconds.'
                        type:
                          type: string
                          readOnly: false
                          writeOnly: false
                          enum:
                          - absolute
                          - relative
                          description: 'Enumeration that controls the use of an explicit time range. A value

                            of "absolute" indicates that you want an explicit time range;

                            "relative" indicates that you want the time relative to the last N

                            milliseconds.  The default is "relative".'
                      description: Options for the time displayed in the detector visualization.
                  description: Options that control the appearance of a detector in the user interface.
              description: Properties to use in creating a new detector using the API
            examples:
              example:
                value:
                  authorizedWriters:
                    teams:
                    - DevOps
                    users:
                    - AAXYAAAAAZ4
                  customProperties:
                  - machineName: dev1
                    systemId: dev
                  - centerId: oregon
                    centerName: oregonDev
                  description: 'JVM CPU Load detector. Monitors the CPU Load for the JVM, and reports overages.

                    '
                  detectorOrigin: Standard
                  maxDelay: 60000
                  minDelay: 60000
                  name: JVM CPU Load detector
                  packageSpecifications: string
                  parentDetectorId: string
                  programText: cpuLoad = data('jvm.cpu.load').percentile(pct=94).publish(label='cpuLoad'); detect(when(cpuLoad > 94)).publish('cpuLoad');
                  rules:
                  - description: JVM CPU Load test
                    detectLabel: cpuLoad
                    disabled: false
                    notifications:
                    - email: user@example.com
                      type: Email
                    - credentialId: myCredentialId
                      type: ServiceNow
                    parameterizedBody: "{{#if anomalous}}\n\tRule \"{{{ruleName}}}\" in detector \"{{{detectorName}}}\" triggered at {{dateTimeFormat timestamp format=\"full\"}}.\n{{else}}\n\tRule \"{{{ruleName}}}\" in detector \"{{{detectorName}}}\" cleared at {{dateTimeFormat timestamp format=\"full\"}}.\n{{/if}}\n\n{{#if anomalous}}\nTriggering condition: {{{readableRule}}}\n{{/if}}\n\nMean value of signal in the last {{event_annotations.current_window}}: {{inputs.summary.value}}\n{{#if anomalous}}Trigger threshold: {{inputs.fire_top.value}}\n{{else}}Clear threshold: {{inputs.clear_top.value}}.\n{{/if}}\n\n{{#notEmpty dimensions}}\nSignal details:\n{{{dimensions}}}\n{{/notEmpty}}\n\n{{#if anomalous}}\n{{#if runbookUrl}}Runbook: {{{runbookUrl}}}{{/if}}\n{{#if tip}}Tip: {{{tip}}}{{/if}}\n{{/if}}"
                    parameterizedSubject: Notification for {{{rulename}}} in detector {{{detectorName}}}
                    reminderNotification:
                      interval: 300000
                      timeout: 3600000
                      type: TIMEOUT
                    runbookUrl: www.example.com
                    severity: Info
                    skipClearNotificationStates:
                    - MANUALLY_RESOLVED
                    - AUTO_RESOLVED
                    tip: Check detector in Splunk Observability Cloud
                  tags:
                  - dev
                  - oregon
                  - offline
                  teams:
                  - DevOps
                  - Engineering
                  - Support
                  timezone: America/Detroit
                  visualizationOptions:
                    disableSampling: false
                    publishLabelOptions:
                    - displayName: JVM CPU load
                      label: cpuLoad
                      paletteIndex: 9
                      valuePrefix: 'Avg '
                      valueSuffix: pct
                      valueUnit: Second
                    showDataMarkers: true
                    showEventLines: true
                    time:
                      end: 1557693030000
                      range: 0
                      start: 1557682230000
                      type: absolute
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                title: Create Detector Response Body
                type: object
                properties:
                  created:
                    title: Creation time
                    type: integer
                    format: int64
                    example: 1556825430000
                    readOnly: true
                    description: 'The time the detector was created, in *nix time in milliseconds.

                      This property is read-only; it''s always set by the system.'
                  creator:
                    title: Creator user ID
                    type: string
                    example: AAXYAAAAAZ3
                    readOnly: true
                    description: 'Splunk Observability Cloud ID of the user who created the detector.

                      This property is read-only; it''s always set by the system.'
                  customProperties:
                    title: Custom properties
                    type: object
                    additionalProperties: null
                    readOnly: false
                    writeOnly: false
                    example:
                      property1: detectorArea
                      value1: internal detectors
                    description: Metadata for a detector, in the form of a JSON object.
                  description:
                    title: Detector description
                    type: string
                    readOnly: false
                    writeOnly: false
                    example: jvm CPU load warning
                    description: 'Description of a detector. The value appears in the Detector window

                      displayed in the UI Actions menu.'
                  detectorOrigin:
                    title: How the detector was created
                    type: string
                    enum:
                    - Standard
                    - AutoDetect
                    - AutoDetectCustomization
                    example: Standard
                    default: Standard
                    description: 'Indicates how a detector was created. The possible values are:


                      Standard: Detector created using the API or the user interface.

                      AutoDetect: Detector is an AutoDetect detector created by Splunk Observability Cloud.

                      AutoDetectCustomization: Detector is a customization of another AutoDetect detector.


                      Note: You can only use Standard or AutoDetectCustomization to create custom detectors. If you try to pass an invalid value for detectorOrigin when creating or updating detectors, you receive a "Not valid detector origin" error message in the response.'
                  id:
                    title: Detector system ID
                    type: string
                    readOnly: true
                    description: 'ID of a detector. When you retrieve events

                      or incidents for a detector, this ID is for the detector that

                      generated the event or incident.

                      This property is read-only; it''s always set by the system.'
                  labelResolutions:
                    title: Alert resolution times
                    type: object
                    readOnly: true
                    additionalProperties:
                      type: integer
                    example:
                      DetectorA: 3000
                      DetectorB: 5000
                    description: 'Key-value pairs that indicate how often data is analyzed to determine if an

                      alert should be triggered, in the form of a JSON object containing

                      properties. Each key is the label name of a call to publish() in the

                      SignalFlow for the detector, and each value is the resolution time

                      for that publish() block.

                      For example, to retrieve the label resolution of the call to

                      publish("DetectorStatement") from this object, use

                      labelResolutions.DetectorStatement.

                      Label resolution is different from the data display resolution used to

                      populate the detector visualization. The data display resolution is

                      automatically set to the coarsest resolution of all of the SignalFlow

                      publish() calls associated with the detector, since they are all

                      displayed together in the same visualization.'
                  lastUpdated:
                    title: Detector last updated time
                    type: integer
                    format: int64
                    example: 1557689430000
                    readOnly: true
                    description: The last time the detector was updated, in *nix time in milliseconds.
                  lastUpdatedBy:
                    title: Detector last updated ID
                    type: string
                    readOnly: true
                    example: ZZyZZZZXXXQ
                    description: 'The ID of the user who last updated the detector. If the system made the last update, the value is "AAAAAAAAAA".

                      This property is read-only; it''s always set by the system.'
                  locked:
                    title: Detector lock state
                    type: boolean
                    example: false
                    description: 'Detector lock state. If true, nobody can modify the detector in any

                      way; otherwise, anyone can modify it.'
                  maxDelay:
                    title: Late-arriving data point delay time
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 900000
                    default: 0
                    readOnly: false
                    writeOnly: false
                    example: 60000
                    description: 'Sets a duration, in milliseconds, to wait for late-arriving data before continuing the SignalFlow computation

                      for the detector. If data is arriving on time, the computation continues before the duration expires.

                      The default is 0, which tells SignalFlow to set the limit dynamically.

                      To set a duration to wait even if data is arriving on time, use minDelay.'
                  minDelay:
                    title: data point pre-processing delay time
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 900000
                    readOnly: false
                    writeOnly: false
                    example: 60000
                    description: 'Sets a duration, in milliseconds, to wait before continuing the SignalFlow computation for the detector.

                      The computation waits for this duration to expire, even if the data is arriving in a timely fashion.

                      To set a duration to wait for late-arriving data, use maxDelay.'
                  name:
                    title: Detector name (displayed)
                    type: string
                    minLength: 1
                    readOnly: false
                    writeOnly: false
                    example: JVM CPU Load detector
                    description: 'Displayed name of the detector in the UI. When you

                      retrieve events or incidents, this property contains the name of the

                      associated detector.'
                  overMTSLimit:
                    type: boolean
                    readOnly: true
                    example: false
                    title: OverMTSLimit
                    description: 'If true, one or more statements in a detector matched too many MTS,

                      and the system forcibly limited the detector. This usually occurs when

                      the detector is looking at incomplete data or an incomplete

                      aggregation. When this flag is true, use partition_filter()

                      functions to split your dataset into smaller pieces, then use the

                      union() function to rejoin the results in a subsequent computation.

                      The union() function still observes the MTS limit, so an

                      aggregation of the partial streams must first limit the dataset prior

                      to recombining the streams.

                      This property is read-only; it''s always set by the system.'
                  packageSpecifications:
                    title: SignalFlow internal field
                    type: string
                    default: ''
                    description: For internal use only
                  parentDetectorId:
                    title: ID of the parent AutoDetect detector
                    type: string
                    description: ID of the parent detector from which this detector is customized and created. This property is required for detectors with detectorOrigin of type AutoDetectCustomization.
                  programText:
                    title: SignalFlow program for the detector
                    type: string
                    readOnly: false
                    writeOnly: false
                    example: cpuLoad = data('jvm.cpu.load').percentile(pct=94).publish(label='cpuLoad'); detect(when(cpuLoad > 94)).publish('cpuLoad');
                    description: 'Specifies the SignalFlow program that defines the detector. This program

                      must include one or more calls to the SignalFlow detect() function.

                      The program must also call publish() on each detect stream, using a

                      label that''s unique to the program.

                      If you want to use custom notification messages that include input data,

                      assign your detect conditions to variables.

                      To use multiple lines in your program, terminate each line with a

                      semicolon ; or newline character \n.

                      To learn more about SignalFlow programs for detectors,

                      see the Detectors topic in the Developers Guide.

                      Note: For detectors with detectorOrigin of type AutoDetectCustomization, it is best practice to keep the same function in the programText property as the parent detector. You can still pass different arguments for the function.'
                  rules:
                    title: Alert Rule Definitions
                    type: array
                    items:
                      title: Detector Rule Object
                      type: object
                      required:
                      - detectLabel
                      - severity
                      properties:
                        description:
                          type: string
                          default: ''
                          readOnly: false
                          writeOnly: false
                          example: JVM CPU Load test
                          title: RuleDescription
                          description: 'Description for the rule. Displays as the alert condition in the

                            Alert Rules tab of the detector editor in the UI'
                        detectLabel:
                          type: string
                          example: cpuLoad
                          title: RuleDetectLabel
                          description: 'Label of the publish() call for the detect() function associated

                            with this rule.'
                        disabled:
                          type: boolean
                          default: false
                          readOnly: false
                          writeOnly: false
                          example: false
                          title: Disabled
                          description: 'Controls the state of an alert rule. If false, the rule is turned on

                            and SignalFlow issues alerts for it. If true, the rule is turned

                            off  and SignaFlow doesn''t issue alerts for it, even if one of the

                            rules is triggered.'
                        notifications:
                          type: array
                          readOnly: false
                          writeOnly: false
                          items:
                            oneOf:
                            - title: Amazon EventBridge Alert Notification
                              type: object
                              required:
                              - type
                              - credentialId
                              properties:
                                type:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  example: AmazonEventBridge
                                  description: 'Tells Splunk Observability Cloud which external system it should use to send the

                                    notification. For an Amazon EventBridge notification, this is always

                                    "AmazonEventBridge".'
                                credentialId:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  description: 'Amazon EventBridge integration identifier, which Splunk Observability Cloud assigns

                                    when you add the integration. Use the UI or the Integrations API

                                    to find the value of credentialId.'
                              description: 'Specifies the properties needed to send a notification from a detector

                                to an existing Splunk Observability Cloud-to-Amazon EventBridge integration'
                            - title: BigPanda Alert Notification
                              type: object
