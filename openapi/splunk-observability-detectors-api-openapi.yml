                                    the integration. Use the UI or the Integrations API to find the

                                    value of credentialId.'
                              description: 'Specifies the properties of a notification service integration between

                                Slack and Splunk Observability Cloud, in the form of a JSON object'
                            - title: Team Email Notification
                              type: object
                              required:
                              - type
                              properties:
                                type:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  example: TeamEmail
                                  description: 'Notification service to use for the notification. For a TeamEmail

                                    notification, this is always "TeamEmail".'
                                team:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  description: 'The ID of a team. All the members of this team

                                    receive an email containing the notification message. Splunk Observability Cloud uses

                                    the email address used to invite the member to the organization.'
                              description: 'Properties of a notification service that sends an alert message email to

                                each member of a team'
                            - title: Team Notification
                              type: object
                              required:
                              - type
                              - team
                              properties:
                                type:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  example: Team
                                  description: 'Tells Splunk Observability Cloud which notification service to use to send the alert message.

                                    For the team notification service, this is always "Team".'
                                team:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  example: DevOps
                                  description: 'The ID of a team. When a rule issues an alert

                                    message, Splunk Observability Cloud sends the message using one of notification services

                                    configured for the team''s notification policy.

                                    Splunk Observability Cloud uses the alert severity to determine the notification

                                    service to use. The team notification policy can specify a different

                                    service for each severity level as well as multiple services per

                                    level.'
                              description: 'Properties of a notification service that sends an alert message to

                                each member of a team, using the team''s notification policy'
                            - title: Splunk On-Call Alert Notification
                              type: object
                              required:
                              - type
                              - credentialId
                              - routingKey
                              properties:
                                type:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  example: VictorOps
                                  description: 'Tells Splunk Observability Cloud which system to use to send the notification. For a

                                    VictorOps notification, this is always "VictorOps".'
                                credentialId:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  description: 'Splunk On-Call integration identifier, which Splunk Observability Cloud assigns when you

                                    add the integration. Use the UI or the Integrations API to find

                                    the value of credentialId.'
                                routingKey:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  description: 'Indicates the routing key used to determine how to process the

                                    notification message. This key specifies where the notification is

                                    posted and how related alerts are escalated. For more information

                                    see the Splunk On-Call knowledge base.'
                              description: 'Specifies the properties of a notification service integration between

                                Splunk On-Call and Splunk Observability Cloud, in the form of a JSON object'
                            - title: Webhook URL Alert Notification
                              type: object
                              required:
                              - type
                              properties:
                                type:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  example: Webhook
                                  description: 'Tells Splunk Observability Cloud which system to use to send the notification. For a

                                    webhook notification, this is always "Webhook".'
                                credentialId:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  description: 'Webhook integration identifier, which Splunk Observability Cloud assigns when you add

                                    the integration. Use the UI or the Integrations API to find the

                                    value of credentialId.'
                                secret:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  description: 'A secret value that identifies the webhook integration to use when

                                    sending notifications. This value also indicates that the

                                    notification has permission to use the integration.  If

                                    credentialId is set, this property is ignored.'
                                url:
                                  type: string
                                  example: https://example.com/alarm/{{incidentId}}?status={{status}}
                                  readOnly: false
                                  writeOnly: false
                                  description: 'The URL of a webhook integration. You can use the Handlebars syntax for this URL. You must provide the mechanism for

                                    processing notifications sent to the URL and routing them to the

                                    proper chat or incident management system. If credentialId is set,

                                    this property is ignored.'
                              description: 'Specifies the properties of a notification service integration between a

                                WebHook URL and Splunk Observability Cloud, in the form of a JSON object'
                            - title: xMatters Alert Notification
                              type: object
                              required:
                              - type
                              - credentialId
                              properties:
                                type:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  example: XMatters
                                  description: 'Tells Splunk Observability Cloud which external system it should use to send the

                                    notification. For an xMatters notification, this is always

                                    "XMatters" (with a capital "X").'
                                credentialId:
                                  type: string
                                  readOnly: false
                                  writeOnly: false
                                  description: 'xMatters integration identifier, which Splunk Observability Cloud assigns when you add

                                    the integration. Use the UI or the Integrations API to find the

                                    value of credentialId.'
                              description: 'Specifies the properties of a notification service integration between

                                xMatters and Splunk Observability Cloud, in the form of a JSON object'
                          example:
                          - email: user@example.com
                            type: Email
                          - credentialId: myCredentialId
                            type: ServiceNow
                          title: Notifications
                          description: 'List of notifications to send when the rule is triggered, in the

                            form of a JSON array.  You can specify more than notification, and

                            each of them can have a different type.

                            To send email notifications:


                            To send emails to a team, the team must already exist.

                            For one or more individual users, use "type": "Email".

                            For a single team, use "type": "TeamEmail".

                            For multiple teams, use multiple array elements, each with "type": "TeamEmail" and the team ID.


                            Email notes:


                            "TeamEmail" sends the notification message to all of the team members,

                            using the member''s email address. This email is the same

                            as the one used to invite the member to the organization, and you

                            can''t change it.

                            "Team" sends notification messages using the team''s notification policy,

                            which may or may not send email to team members. To learn more, see

                            the description of the "Team" notification type.'
                        reminderNotification:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - TIMEOUT
                              example: TIMEOUT
                              description: Type of reminder notifications. The only supported value is TIMEOUT.
                            interval:
                              type: integer
                              format: int64
                              example: 300000
                              description: The interval at which you want to receive reminder notifications, in milliseconds. Interval value must be between 5 minutes and 7 days, inclusive. Interval value must be shorter than or equal to the value of timeout. The minimum resolution is minutes. For example, you can’t specify this value as 5 minutes and 1 second.
                            timeout:
                              type: integer
                              format: int64
                              example: 3600000
                              description: The duration during which you want to receive reminder notifications, in milliseconds. Timeout value must be between 5 minutes and 7 days, inclusive. Timeout value must be longer than or equal to the value of interval. The minimum resolution is minutes. For example, you can’t specify this value as 5 minutes and 1 second.
                          title: ReminderNotification
                          description: Set up reminder notifications for your detectors so you can receive multiple notifications for active alerts over a defined period of time.
                        skipClearNotificationStates:
                          type: array
                          items:
                            type: string
                            enum:
                            - OK
                            - AUTO_RESOLVED
                            - STOPPED
                            - MANUALLY_RESOLVED
                            title: AlertClearState
                            description: 'Specifies the different states an alert can transition to when clearing, in the form of a JSON string.

                              These states can be used in the skipClearNotificationStates property to control which types of clear

                              notifications are sent. The possible values are:


                              "OK": The alert is cleared.

                              "AUTO_RESOLVED": The Auto-clear setting is applied to the detector and the specified duration has elapsed. To learn more, see Auto-clear alerts.

                              "STOPPED": The detector is muted or inactive when the alert is triggered.

                              "MANUALLY_RESOLVED": The alert is manually set as resolved during an alert state.'
                          example:
                          - MANUALLY_RESOLVED
                          - AUTO_RESOLVED
                          description: 'Specifies which types of alert clear states should not trigger notifications, in the form of

                            a JSON array of AlertClearState enum values. When an alert clears with one of the specified

                            states, notifications will be suppressed while the alert state and incident data are still

                            updated normally. This allows you to reduce notification noise by selectively suppressing

                            clear notifications based on how the alert was resolved.

                            For example, you might want to suppress notifications when alerts are manually resolved

                            or auto-resolved due to missing data, but still receive notifications when alerts clear

                            naturally (OK state).'
                        parameterizedBody:
                          type: string
                          readOnly: false
                          writeOnly: false
                          example: "{{#if anomalous}}\n\tRule \"{{{ruleName}}}\" in detector \"{{{detectorName}}}\" triggered at {{dateTimeFormat timestamp format=\"full\"}}.\n{{else}}\n\tRule \"{{{ruleName}}}\" in detector \"{{{detectorName}}}\" cleared at {{dateTimeFormat timestamp format=\"full\"}}.\n{{/if}}\n\n{{#if anomalous}}\nTriggering condition: {{{readableRule}}}\n{{/if}}\n\nMean value of signal in the last {{event_annotations.current_window}}: {{inputs.summary.value}}\n{{#if anomalous}}Trigger threshold: {{inputs.fire_top.value}}\n{{else}}Clear threshold: {{inputs.clear_top.value}}.\n{{/if}}\n\n{{#notEmpty dimensions}}\nSignal details:\n{{{dimensions}}}\n{{/notEmpty}}\n\n{{#if anomalous}}\n{{#if runbookUrl}}Runbook: {{{runbookUrl}}}{{/if}}\n{{#if tip}}Tip: {{{tip}}}{{/if}}\n{{/if}}"
                          title: ParameterizedBody
                          description: 'Custom notification message body for a rule, displayed in the alert

                            notification. The body content must be plain text:


                            Escape quote characters with a backslash

                            Indicate a newline with the "\n" string.

                            To insert an alert variable value, enclose the name in curly brackets "{}".

                            To do partial escaping of the variable, enclose it in double curly

                            brackets "{{}}". This ensures that characters in the body don''t

                            trigger unintended results in Splunk Observability Cloud or the notification service.

                            To do full escaping of the variable, enclose it in triple curly

                            brackets "{{{}}}". Splunk Observability Cloud escapes the variable as needed so

                            that characters such as quotation marks and angle brackets render

                            correctly.

                            If you''re unsure which style of variable to use, use triple curly brackets,

                            so that all content renders properly.


                            Splunk Observability Cloud provides recommendations for the notation style to use

                            with each supported variable.

                            To learn more about working with custom notification messages using the

                            API, see Custom notification messages.

                            To see a full list of variables with their default notation, see the

                            section Message preview

                            in the user documentation.'
                        parameterizedSubject:
                          type: string
                          readOnly: false
                          writeOnly: false
                          example: Notification for {{{rulename}}} in detector {{{detectorName}}}
                          title: ParameterizedSubject
                          description: 'Custom notification subject for a rule, displayed in the alert

                            notification. The content must be plain text:


                            Escape quote characters with a backslash

                            Indicate a newline with the "\n" string.

                            To insert an alert variable value, enclose the name in

                            curly brackets {}.

                            To do partial escaping of the variable, enclose it in double curly

                            brackets {{}}. This ensures that characters in the body don''t

                            trigger unintended results in Splunk Observability Cloud or the notification service.

                            To do full escaping of the variable, enclose it in triple curly

                            brackets {{{}}}. Splunk Observability Cloud escapes the variable as needed so

                            that characters such as quotation marks and angle brackets render

                            correctly.

                            If you''re unsure which style of variable to use, use triple curly brackets,

                            so that all content renders properly.


                            Splunk Observability Cloud provides recommendations for the notation style to use

                            with each supported variable.

                            To learn more about custom notification messages in the API, see the API topics section

                            Custom notification messages

                            in the Developers Guide.

                            To see a full list of variables with their default notation, see the

                            section Message preview

                            in the user documentation.'
                        runbookUrl:
                          type: string
                          format: URL
                          readOnly: false
                          writeOnly: false
                          example: www.example.com
                          title: RunbookUrl
                          description: 'Provides a link from an alert rule to a runbook, in the form of a URL

                            that you can refer to with the Splunk Observability Cloud {{runbookURL}}

                            variable in the parameterizedBody or parameterizedSubject properties.'
                        severity:
                          type: string
                          format: Capitalized
                          enum:
                          - Critical
                          - Warning
                          - Major
                          - Minor
                          - Info
                          example: Info
                          readOnly: false
                          writeOnly: false
                          title: Severity
                          description: 'Indicates the severity of a triggered alert. You can assign your own

                            semantics to each severity level. To see the available values,  refer to

                            the enum specification.

                            Note: The allowed values for Severity

                            are enums, so you must enter them with the first letter in uppercase and

                            all other letters lowercase.

                            The PagerDuty alerting service maps

                            Splunk Observability Cloud severity values to PagerDuty service values as follows

                            (Splunk Observability Cloud values are at the beginning of the line):


                            Critical → Critical

                            Major → Critical

                            Minor → Error

                            Warning → Warning

                            Info → Info'
                        tip:
                          title: Text that describes first action to take upon receiving an alert
                          type: string
                          example: Check detector in Splunk Observability Cloud
                          description: 'Plain text to show in the notification message for an alert. Use this

                            text to suggest the first course of action to take when a signal triggers an alert.

                            To show this text, customize the parameterizedBody property to add the

                            {{{tip}}} variable.'
                      description: Single alert rule
                    readOnly: false
                    writeOnly: false
                  status:
                    title: Status of this detector
                    type: string
                    readOnly: true
                    enum:
                    - ABORTED
                    - ACTIVE
                    - INITIALIZING
                    - RETRYING_INITIALIZATION
                    - FAILED
                    example: ACTIVE
                    description: 'Status of the analytics job for this detector. This property is read-only. The possible

                      values are:


                      "ABORTED": The analytics job for this detector has been aborted by the system.

                      "ACTIVE": The analytics job for this detector is up and running.

                      "INITIALIZING": The analytics job for this detector is starting up after creation or re-starting after an update.

                      "RETRYING_INITIALIZATION": The analytics job for this detector failed to start and Splunk Observability Cloud will try to start the job again after some time.

                      "FAILED": The analytics job for this detector failed to start and the system has reached maximum number of initialization attempts.'
                  tags:
                    title: Keyword filters
                    type: array
                    readOnly: false
                    writeOnly: false
                    items:
                      type: string
                      maxLength: 256
                      maxItems: 50
                      readOnly: false
                      writeOnly: false
                      description: 'UTF-8 string, starting with an uppercase or lowercase alphabetic character.

                        The maximum length is expressed in characters; if a string consists solely

                        of single-byte UTF-8 entities, 1024 characters are available.'
                    example:
                    - dev
                    - oregon
                    - offline
                    description: 'Array of keywords that filters detectors by one of their properties. Use

                      tags to indicate the state of a detector or its data source (for

                      example, you can label a detector with a "prod" tag to indicate that it

                      monitors a production environment).

                      Note: You can have no more than 50 tags per detector.'
                  teams:
                    title: Team IDs for this detector
                    type: array
                    readOnly: false
                    writeOnly: false
                    items:
                      type: string
                      readOnly: false
                      writeOnly: false
                    example:
                    - DevOps
                    - Engineering
                    - Support
                    description: 'IDs of teams associated with this detector. The teams

                      associated  with a detector can see the detector and its active alerts

                      on the team''s landing page in the UI. The list of teams associated

                      with a detector is independent of notification settings.  Teams

                      specified in this field don''t automatically get notified of new alerts,

                      and teams that choose to get alerts do not have to display the detector

                      on their team landing page in the web application.'
                  timezone:
                    title: Time zone for SignalFlow calendar window transformations
                    type: string
                    default: UTC
                    readOnly: false
                    writeOnly: false
                    example: America/Detroit
                    description: 'Specifies which time zone SignalFlow should use as the basis of calendar

                      window transformation methods. For example, if you set "timezone": "Europe/Paris" and then use the transformation sum(cycle="week", cycle_start="Monday") in your detector''s SignalFlow program, the

                      calendar window starts on Monday, Paris time.

                      For a list of supported time zones,

                      see Time zone for calendar window transformations.'
                  visualizationOptions:
                    title: Detector appearance options
                    type: object
                    properties:
                      disableSampling:
                        type: boolean
                        default: false
                        readOnly: false
                        writeOnly: false
                        example: false
                        description: 'If true, Splunk Observability Cloud displays all data points in the detect()

                          streams; otherwise, Splunk Observability Cloud only samples data points. Using sampling

                          improves performance.'
                      publishLabelOptions:
                        title: List of display options for the detector's chart
                        type: array
                        items:
                          title: Display options for the detector's chart
                          type: object
                          properties:
                            displayName:
                              title: Detector chart display name
                              type: string
                              example: JVM CPU load
                              description: 'Specifies the Data Table column header for a single publish() block

                                in a detector''s chart. If you don''t specify a value, Splunk Observability Cloud uses the

                                name of the dimension that''s providing the data for the publish()

                                block.'
                            label:
                              title: Label of a publish() object in a SignalFlow program
                              type: string
                              example: cpuLoad
                              description: 'Specifies a SignalFlow publish() object label. Splunk Observability Cloud uses this value

                                to associate the publish() block output with a publishLabelOptions

                                object.'
                            paletteIndex:
                              title: Color choice
                              type: integer
                              minimum: 0
                              maximum: 15
                              example: 9
                              description: '0-based index into the color table displayed in

                                Charts color palettes.

                                Only the first 16 entries (0-15) are allowed for this value. Splunk Observability Cloud uses the

                                index to determine which color to use for displaying the output of a single publish()

                                object in a detector''s table.'
                            valuePrefix:
                              title: String to prepend to data table values
                              type: string
                              example: 'Avg '
                              description: 'Specifies a string to prepend to the value in a data table for

                                a detector''s chart. This string also appears in the tooltip you see

                                when you hover over a point on a chart. To learn more, see the

                                example in Single value charts.

                                Splunk Observability Cloud overrides valuePrefix if you set options.publishLabelOptions.valueUnit for the same

                                plot.'
                            valueSuffix:
                              title: String to append to detector chart's data table values
                              type: string
                              example: pct
                              description: 'Specifies a string to append to the value in the data table for a

                                detector''s chart. This string also appears in the tooltip you see when

                                you hover over a point in the chart. To learn more, see the

                                example in Single value charts.

                                Splunk Observability Cloud overrides valueSuffix if you set options.publishLabelOptions.valueUnit

                                for the same plot.'
                            valueUnit:
                              title: Display units used with the detector's chart
                              type: string
                              enum:
                              - Bit
                              - Kilobit
                              - Megabit
                              - Gigabit
                              - Terabit
                              - Petabit
                              - Exabit
                              - Zettabit
                              - Yottabit
                              - Byte
                              - Kibibyte
                              - Mebibyte
                              - Gibibyte
                              - Tebibyte
                              - Pebibyte
                              - Exbibyte
                              - Zebibyte
                              - Yobibyte
                              - Nanosecond
                              - Microsecond
                              - Millisecond
                              - Second
                              - Minute
                              - Hour
                              - Day
                              - Week
                              example: Second
                              description: 'Specifies the units of measure for values displayed in a detector''s chart.

                                Splunk Observability Cloud assumes that the raw data uses the unit of measure you select.

                                For example, the value 1000 in a chart where you''ve set

                                options.publishLabelOption.valueUnit to bits appears as 1 Kilobit,

                                and the value 1024 in a plot set to Bytes appears as 1 Kebibyte.

                                Splunk Observability Cloud scales units within their own unit type. Refer to

                                Display units and other labels

                                for a full specification. The options.publishLabelOptions.valueUnit option applies to scaling

                                and labeling in chart tooltips, axes, and data tables. If

                                options.publishLabelOptions.valueUnit affects the chart

                                presentation, it overrides options.publishLabelOptions.valuePrefix and

                                options.publishLabelOptions.valueSuffix.'
                          description: 'One set of options that control the appearance of a publish() block

                            in a detector''s chart, in the form of a JSON object. Splunk Observability Cloud matches the

                            objects label value to match it to its publish() block.'
                        description: 'List of display options for a detector''s chart. Each element in the list

                          contains the options for a single SignalFlow publish() block in the

                          detector''s SignalFlow program. The list has the form of a JSON array of

                          objects.

                          Splunk Observability Cloud matches an object''s label value to match it to a publish()

                          block.'
                      showDataMarkers:
