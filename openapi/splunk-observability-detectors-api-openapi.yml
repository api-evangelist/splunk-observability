                        title: Notifications
                        description: 'List of notifications to send when the rule is triggered, in the

                          form of a JSON array.  You can specify more than notification, and

                          each of them can have a different type.

                          To send email notifications:


                          To send emails to a team, the team must already exist.

                          For one or more individual users, use "type": "Email".

                          For a single team, use "type": "TeamEmail".

                          For multiple teams, use multiple array elements, each with "type": "TeamEmail" and the team ID.


                          Email notes:


                          "TeamEmail" sends the notification message to all of the team members,

                          using the member''s email address. This email is the same

                          as the one used to invite the member to the organization, and you

                          can''t change it.

                          "Team" sends notification messages using the team''s notification policy,

                          which may or may not send email to team members. To learn more, see

                          the description of the "Team" notification type.'
                      reminderNotification:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - TIMEOUT
                            example: TIMEOUT
                            description: Type of reminder notifications. The only supported value is TIMEOUT.
                          interval:
                            type: integer
                            format: int64
                            example: 300000
                            description: The interval at which you want to receive reminder notifications, in milliseconds. Interval value must be between 5 minutes and 7 days, inclusive. Interval value must be shorter than or equal to the value of timeout. The minimum resolution is minutes. For example, you can’t specify this value as 5 minutes and 1 second.
                          timeout:
                            type: integer
                            format: int64
                            example: 3600000
                            description: The duration during which you want to receive reminder notifications, in milliseconds. Timeout value must be between 5 minutes and 7 days, inclusive. Timeout value must be longer than or equal to the value of interval. The minimum resolution is minutes. For example, you can’t specify this value as 5 minutes and 1 second.
                        title: ReminderNotification
                        description: Set up reminder notifications for your detectors so you can receive multiple notifications for active alerts over a defined period of time.
                      skipClearNotificationStates:
                        type: array
                        items:
                          type: string
                          enum:
                          - OK
                          - AUTO_RESOLVED
                          - STOPPED
                          - MANUALLY_RESOLVED
                          title: AlertClearState
                          description: 'Specifies the different states an alert can transition to when clearing, in the form of a JSON string.

                            These states can be used in the skipClearNotificationStates property to control which types of clear

                            notifications are sent. The possible values are:


                            "OK": The alert is cleared.

                            "AUTO_RESOLVED": The Auto-clear setting is applied to the detector and the specified duration has elapsed. To learn more, see Auto-clear alerts.

                            "STOPPED": The detector is muted or inactive when the alert is triggered.

                            "MANUALLY_RESOLVED": The alert is manually set as resolved during an alert state.'
                        example:
                        - MANUALLY_RESOLVED
                        - AUTO_RESOLVED
                        description: 'Specifies which types of alert clear states should not trigger notifications, in the form of

                          a JSON array of AlertClearState enum values. When an alert clears with one of the specified

                          states, notifications will be suppressed while the alert state and incident data are still

                          updated normally. This allows you to reduce notification noise by selectively suppressing

                          clear notifications based on how the alert was resolved.

                          For example, you might want to suppress notifications when alerts are manually resolved

                          or auto-resolved due to missing data, but still receive notifications when alerts clear

                          naturally (OK state).'
                      parameterizedBody:
                        type: string
                        readOnly: false
                        writeOnly: false
                        example: "{{#if anomalous}}\n\tRule \"{{{ruleName}}}\" in detector \"{{{detectorName}}}\" triggered at {{dateTimeFormat timestamp format=\"full\"}}.\n{{else}}\n\tRule \"{{{ruleName}}}\" in detector \"{{{detectorName}}}\" cleared at {{dateTimeFormat timestamp format=\"full\"}}.\n{{/if}}\n\n{{#if anomalous}}\nTriggering condition: {{{readableRule}}}\n{{/if}}\n\nMean value of signal in the last {{event_annotations.current_window}}: {{inputs.summary.value}}\n{{#if anomalous}}Trigger threshold: {{inputs.fire_top.value}}\n{{else}}Clear threshold: {{inputs.clear_top.value}}.\n{{/if}}\n\n{{#notEmpty dimensions}}\nSignal details:\n{{{dimensions}}}\n{{/notEmpty}}\n\n{{#if anomalous}}\n{{#if runbookUrl}}Runbook: {{{runbookUrl}}}{{/if}}\n{{#if tip}}Tip: {{{tip}}}{{/if}}\n{{/if}}"
                        title: ParameterizedBody
                        description: 'Custom notification message body for a rule, displayed in the alert

                          notification. The body content must be plain text:


                          Escape quote characters with a backslash

                          Indicate a newline with the "\n" string.

                          To insert an alert variable value, enclose the name in curly brackets "{}".

                          To do partial escaping of the variable, enclose it in double curly

                          brackets "{{}}". This ensures that characters in the body don''t

                          trigger unintended results in Splunk Observability Cloud or the notification service.

                          To do full escaping of the variable, enclose it in triple curly

                          brackets "{{{}}}". Splunk Observability Cloud escapes the variable as needed so

                          that characters such as quotation marks and angle brackets render

                          correctly.

                          If you''re unsure which style of variable to use, use triple curly brackets,

                          so that all content renders properly.


                          Splunk Observability Cloud provides recommendations for the notation style to use

                          with each supported variable.

                          To learn more about working with custom notification messages using the

                          API, see Custom notification messages.

                          To see a full list of variables with their default notation, see the

                          section Message preview

                          in the user documentation.'
                      parameterizedSubject:
                        type: string
                        readOnly: false
                        writeOnly: false
                        example: Notification for {{{rulename}}} in detector {{{detectorName}}}
                        title: ParameterizedSubject
                        description: 'Custom notification subject for a rule, displayed in the alert

                          notification. The content must be plain text:


                          Escape quote characters with a backslash

                          Indicate a newline with the "\n" string.

                          To insert an alert variable value, enclose the name in

                          curly brackets {}.

                          To do partial escaping of the variable, enclose it in double curly

                          brackets {{}}. This ensures that characters in the body don''t

                          trigger unintended results in Splunk Observability Cloud or the notification service.

                          To do full escaping of the variable, enclose it in triple curly

                          brackets {{{}}}. Splunk Observability Cloud escapes the variable as needed so

                          that characters such as quotation marks and angle brackets render

                          correctly.

                          If you''re unsure which style of variable to use, use triple curly brackets,

                          so that all content renders properly.


                          Splunk Observability Cloud provides recommendations for the notation style to use

                          with each supported variable.

                          To learn more about custom notification messages in the API, see the API topics section

                          Custom notification messages

                          in the Developers Guide.

                          To see a full list of variables with their default notation, see the

                          section Message preview

                          in the user documentation.'
                      runbookUrl:
                        type: string
                        format: URL
                        readOnly: false
                        writeOnly: false
                        example: www.example.com
                        title: RunbookUrl
                        description: 'Provides a link from an alert rule to a runbook, in the form of a URL

                          that you can refer to with the Splunk Observability Cloud {{runbookURL}}

                          variable in the parameterizedBody or parameterizedSubject properties.'
                      severity:
                        type: string
                        format: Capitalized
                        enum:
                        - Critical
                        - Warning
                        - Major
                        - Minor
                        - Info
                        example: Info
                        readOnly: false
                        writeOnly: false
                        title: Severity
                        description: 'Indicates the severity of a triggered alert. You can assign your own

                          semantics to each severity level. To see the available values,  refer to

                          the enum specification.

                          Note: The allowed values for Severity

                          are enums, so you must enter them with the first letter in uppercase and

                          all other letters lowercase.

                          The PagerDuty alerting service maps

                          Splunk Observability Cloud severity values to PagerDuty service values as follows

                          (Splunk Observability Cloud values are at the beginning of the line):


                          Critical → Critical

                          Major → Critical

                          Minor → Error

                          Warning → Warning

                          Info → Info'
                      tip:
                        title: Text that describes first action to take upon receiving an alert
                        type: string
                        example: Check detector in Splunk Observability Cloud
                        description: 'Plain text to show in the notification message for an alert. Use this

                          text to suggest the first course of action to take when a signal triggers an alert.

                          To show this text, customize the parameterizedBody property to add the

                          {{{tip}}} variable.'
