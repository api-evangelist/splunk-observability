  /detector/{id}/enable:
    put:
      summary: Enable Detect Blocks
      description: 'Enables detect() blocks in the detector specified by the {id} path parameter.

        You can use PUT /detector/{id}/enable with both Standard and AutoDetect detectors.

        When you enable a disabled detect() block, it starts creating events again.

        If you muted notifications for dimensions or properties associated with this

        detect() block, you have to unmute them separately.

        Sending this request for a detect() block that''s already enabled

        doesn''t return an error, and the detector remains enabled. You can

        make the request without first checking the current state of the detector.

        Enabling a detect() block doesn''t clear active alerts. Instead,

        Splunk Observability Cloud keeps them until after you clear the condition in the signal

        that first triggered the block. To learn more about enabling and unmuting,

        see the section Notification muting.

        This request doesn''t return a response body.'
      parameters:
      - name: id
        in: path
        description: 'Detector ID of the detector that contains

          the detect() blocks you want to enable. Using the API, you can

          retrieve this value using GET /v2/detector with the detector''s

          name.'
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Format of the request body. Always "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
