                  - Engineering
                  - Support
                  description: 'IDs of teams associated with this detector. The teams

                    associated  with a detector can see the detector and its active alerts

                    on the team''s landing page in the UI. The list of teams associated

                    with a detector is independent of notification settings.  Teams

                    specified in this field don''t automatically get notified of new alerts,

                    and teams that choose to get alerts do not have to display the detector

                    on their team landing page in the web application.'
                timezone:
                  title: Time zone for SignalFlow calendar window transformations
                  type: string
                  default: UTC
                  readOnly: false
                  writeOnly: false
                  example: America/Detroit
                  description: 'Specifies which time zone SignalFlow should use as the basis of calendar

                    window transformation methods. For example, if you set "timezone": "Europe/Paris" and then use the transformation sum(cycle="week", cycle_start="Monday") in your detector''s SignalFlow program, the

                    calendar window starts on Monday, Paris time.

                    For a list of supported time zones,

                    see Time zone for calendar window transformations.'
