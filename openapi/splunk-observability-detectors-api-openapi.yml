                            - Pebibyte
                            - Exbibyte
                            - Zebibyte
                            - Yobibyte
                            - Nanosecond
                            - Microsecond
                            - Millisecond
                            - Second
                            - Minute
                            - Hour
                            - Day
                            - Week
                            example: Second
                            description: 'Specifies the units of measure for values displayed in a detector''s chart.

                              Splunk Observability Cloud assumes that the raw data uses the unit of measure you select.

                              For example, the value 1000 in a chart where you''ve set

                              options.publishLabelOption.valueUnit to bits appears as 1 Kilobit,

                              and the value 1024 in a plot set to Bytes appears as 1 Kebibyte.

                              Splunk Observability Cloud scales units within their own unit type. Refer to

                              Display units and other labels

                              for a full specification. The options.publishLabelOptions.valueUnit option applies to scaling

                              and labeling in chart tooltips, axes, and data tables. If

                              options.publishLabelOptions.valueUnit affects the chart

                              presentation, it overrides options.publishLabelOptions.valuePrefix and

