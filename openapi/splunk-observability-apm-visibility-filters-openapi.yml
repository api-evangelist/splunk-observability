    delete:
      summary: deleteVisibilityFilter
      description: 'Performs a hard delete on the filter associated with the filter ID.

        Requirements

        You have to have the Splunk Observability Cloud admin role to use the DELETE apm/visibility-filter/{FilterId} operation.'
      parameters:
