                      title: LocationIds
                      description: An array of location IDs where the test runs.
                    name:
                      type: string
                      example: My API test
                    frequency:
                      type: integer
                      format: int32
                      example: 5
                      title: Frequency
                      description: How often to run your test.
                    schedulingStrategy:
