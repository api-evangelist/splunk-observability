  /metrictimeseries:
    get:
      summary: Retrieve Metric Timeseries Metadata
      description: 'Retrieves metadata for the metric timeseries specified by the search criteria in the query query parameter.

        The query can contain one or more of the following:


        Metric name

        Dimensions

        Custom properties

        Tags


        The API first collects all of the matching results. This is known as the result set. Depending on the value you specify for limit, the number of metadata objects in the response body can be smaller than than the result set. For example, if you specify limit=50, and the API finds 100 matches, you only receive the first 50 results.

        Splunk Observability Cloud returns a maximum of 10,000 objects, even if your organization contains more. To learn more, see the Considerations for retrieve operations section in the developer guide.'
      parameters:
      - name: query
        in: query
        description: 'Search criteria that selects the metric timeseries for which you want metadata.

          Search criteria have the following rules:


          To search by metric name, use query=metric:<metric_name> or query=sf_metric:<metric_name>. The result is metadata for MTS that have that metric name.

          Metrics and MTS generated by Splunk Observability Cloud start with the prefix sf. or sf_metric.

          To search by dimension name, use query=<dimension_name>:*. The result

          is metadata for MTS that have a dimension with that dimension name,

          regardless of metric name.

          To search for specific values of a dimension or custom property, use query=<name>:<value>. The result is metadata for MTS that have that dimension or property, regardless of metric name. If <value> contains non-alphanumeric characters, encode the non-alphanumeric characters and surround the value with double quotes. For example, the region custom property value US East must be passed in the parameter as region:"US%20East".

          To search with a wildcard character, use *. For example, to

          search for all of the values of the region dimension, use

          query=region:*.

          To search for the existence of dimensions or properties, use

          _exists_ and _missing_. For example, to search for metadata that

          has the host_machine dimension, specify query=_exists_:host_machine.

          A single name and value (or wildcards) make up a

          predicate  that implicitly returns a boolean.

          Join predicates with the NOT, AND, and OR boolean operators.

          Use parentheses ''('' and '')'' to change the evaluation order.

          For example, to retrieve all metadata that has the dimension

          region:emea and the custom property company with values that

          start with Schneider*, use query=region:emea AND company:Schneider*.'
        schema:
          type: string
      - name: limit
        in: query
        description: Number of result objects to return from the result set.
        schema:
          type: integer
          format: int32
      - name: searchInactive
        in: query
        description: 'Flag that controls the retrieval of metadata for inactive MTS.

          The default for searchInactive is false, so GET /metrictimeseries

          only searches for active MTS.

          If the query parameter includes active MTS filter terms like sf_isActive or sf_lastActiveMs, then this flag value is ignored.'
        schema:
          type: boolean
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        created:
                          type: integer
                          format: int64
                          example: 1557743430000
                          description: MTS creation timestamp, in *nix time in milliseconds.
                        creator:
                          type: string
                          description: 'ID of the user who created the MTS. This can

                            be one of the following:


                            ID of user who created the integration that sent the MTS

                            ID of user who sent the MTS using the API


                            If the value is "AAAAAAAAAAA", Splunk Observability Cloud created the MTS.'
                        customProperties:
                          type: object
                          additionalProperties: true
                          maxItems: 50
                          description: 'MTS custom properties, in the form of a JSON object.

                            Each object property is a custom property key-value pair.

                            The section [/docs/datamodel/metrics_metadata#Custom-properties-criteria)

                            lists the requirements for custom properties.'
                        dimensions:
                          type: object
                          maxItems: 50
                          additionalProperties: true
                          description: 'MTS dimensions, in the form of a JSON object. Each object property

                            is a dimension key-value pair.

                            The section Dimension Criteria

                            lists the requirements for dimensions.'
                        lastUpdated:
                          type: integer
                          format: int64
                          readOnly: true
                          example: 1557916230000
                          description: MTS last updated timestamp, in *nix time in milliseconds.
                        lastUpdatedBy:
                          type: string
                          description: 'ID of the user who last updated the MTS by

                            modifying its metadata. If the value is "AAAAAAAAAAA", Splunk Observability Cloud

                            last modified the metric.'
                        metric:
                          type: string
                          maxLength: 256
                          description: 'MTS metric name. Metric names are UTF-8 strings with a maximum

                            length of 256 characters (1024 bytes).'
                        tags:
                          type: array
                          items:
                            type: string
                            maxLength: 256
                          maxItems: 50
                          description: 'MTS tags, in the form of a JSON array of strings.

                            Each tag is in UTF-8, starting with an uppercase or lowercase

                            alphabetic character. The maximum length is expressed in characters;

                            if a string consists solely of single-byte UTF-8 entities, 1024

                            characters are available.'
                        type:
                          type: string
                          enum:
                          - GAUGE
                          - COUNTER
                          - CUMULATIVE_COUNTER
                          - HISTOGRAM
                          description: 'Metric type of the MTS. The possible values are

                            "GAUGE", "COUNTER", "CUMULATIVE_COUNTER", and "HISTOGRAM". To learn more, refer to the

                            Metric types section in the user documentation.'
                      title: MTSMetadata
                      description: Metadata for an MTS
                    description: 'List of metadata for retrieved MTS, in the form of a JSON array.

                      Each element contains metadata for a single MTS.'
                  count:
                    type: integer
                    format: int64
