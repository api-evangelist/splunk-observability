  /tag:
    get:
      summary: Retrieve Tag Metadata Using Query
      description: 'Retrieves metadata for which the tag matches the search criteria.

        The API first collects all of the matching results. This is known as the

        result set. Depending on the values you specify for offset and

        limit, the number of metadata objects in the response body can be

        smaller than than the result set. For example, if you specify offset=0

        (the default) and limit=50, and the API finds 100 matches, you only

        receive the first 50 results.

        Note: Splunk Observability Cloud returns a maximum of 10,000 tags, even if your organization contains more than 10,000. To learn more, see the

        Considerations for retrieve operations section in the developer guide.'
      parameters:
      - name: query
        in: query
        description: 'Search criteria for tags.

          Use the following syntax rules:


          To search for a tag, specify query=<tagname>. If <tagname> contains

          non-alphanumeric characters, encode the non-alphanumeric characters and surround the value with

          double quotes. For example, the tag prod env must be passed in the parameter as query="prod%20env".

          Use * as a wildcard. For example, to

          search for tags that start with the string "python", use

          `query="python*".'
        schema:
          type: string
      - name: order_by
        in: query
        description: 'Result object property on which the API should sort the results.

          This must be a property of the tag metadata object.

          Prepend a - character to the property name to sort in descending order. If you want to apply order_by to non-custom property fields like timestamp, prepend the field with sf_. For example: order_by=-sf_timestamp.'
        schema:
          type: string
      - name: offset
        in: query
        description: 'Object in the result set at which the API should start returning

          results to you. If omitted, the API starts at the first result in the

          set.'
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Number of results to return from the result set.
        schema:
          type: integer
          format: int32
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int64
                    description: 'Number of metadata objects that matched the specified search criteria.

                      This isn''t  the same as sizeOf(results), because the limit and

                      offset query parameters affect the number of objects the API

                      returns in the response body.'
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        created:
                          type: integer
                          format: int64
                          readOnly: true
                          example: 1554287430000
                          description: 'Tag creation timestamp, in *nix time in milliseconds.

                            This property is set by the system, and you can''t modify it.'
                        creator:
