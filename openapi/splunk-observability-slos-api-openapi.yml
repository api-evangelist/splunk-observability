  /slo/search:
    post:
      summary: Search SLO
      description: 'Search for SLOs by name, ID, metadata, or alert status.

        Note: You only need one of the listed request body parameters for your search SLO request to be valid.'
      parameters:
      - name: limit
        in: query
        description: 'Number of SLOs to retrieve from the list of SLOs that match your search criteria.

          When used togeter, the offset and limit properties provide paged access to the query results. You can repeatedly download small slices of a large query result, which helps you avoid bandwidth and performance.'
        schema:
          type: integer
          format: int32
          default: 50
          example: 10
          minimum: 0
          maximum: 10000
      - name: offset
        in: query
        description: 'Index of the SLO object you want to use as the starting point for the result set.

          When used togeter, the offset and limit properties provide paged access to the query results. You can repeatedly download small slices of a large query result, which helps you avoid bandwidth and performance.'
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
          example: 10
      - name: orderBy
        in: query
        description: 'List of criteria by which to sort the returned result set. You can use the following fields:


          name

          description

          creator

          created

          lastUpdated

          lastUpdatedBy

          breachAlertsTriggered

          errorBudgetLeftAlertsTriggered

          burnRateAlertsTriggered


          Include a dash ( - ) before a criterion to indicate a descending sort order. The default sorting criterion is -lastUpdated, which means the result list is sorted from most recently updated to least recently updated.'
        schema:
          type: array
          items:
            type: string
          default:
          - -lastUpdated
          example:
          - name
      - name: Content-Type
        in: header
        description: Request body format. Always "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Search SLO Request Body
              type: object
              properties:
                name:
                  title: SLO name
                  type: string
                  example: Test SLO
                  description: Name of the SLO you want to search for. The API matches this value to the name property of exisiting SLOs. The match can be full or partial.
                sloIds:
                  title: SLO IDs
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example:
                  - EU61I2AAEdA
                  - EU61I7AAEdA
                  description: IDs of the SLOs you want to search for
                metadata:
                  title: SLO metadata
                  type: array
                  items:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  example:
                  - - sf_service:*
                breachAlertsTriggered:
                  title: Breach alerts triggered
                  type: boolean
                  default: false
                  example: true
                  description: Set to true to search for SLOs with active breach incidents.
                errorBudgetLeftAlertsTriggered:
                  title: Error budget alerts triggered
                  type: boolean
                  default: false
                  example: true
                  description: Set to true to search for SLOs with active error budget left incidents.
                burnRateAlertsTriggered:
                  title: Burn rate alerts triggered
                  type: boolean
                  default: false
                  example: true
                  description: Set to true to search for SLOs with active burn rate incidents.
              description: Properties used to search for SLOs using the API.
            examples:
              example:
                value:
                  breachAlertsTriggered: true
                  burnRateAlertsTriggered: true
                  errorBudgetLeftAlertsTriggered: true
                  metadata:
                  - - sf_service:*
                  name: Test SLO
                  sloIds:
                  - EU61I2AAEdA
                  - EU61I7AAEdA
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                title: Search SLO Response Body
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                    example: 1
                    description: 'Number of SLO objects matching the provided search criteria.

                      Note: This value is the total number of matches, not the number of SLOs returned. The number of SLOs that the system returns is affected by the limit and offset query parameters.

                      In summary:


                      sizeOf(results): Number of SLO objets returned in the response body.

                      count: Number of SLO objects matcing the search criteria.'
                  results:
                    type: array
                    items:
                      title: Service Level Objective Object
                      type: object
                      properties:
                        created:
                          title: SLO creation time
                          type: integer
                          format: int64
                          readOnly: true
                          example: 1556825430000
                          description: Date and time the SLO was created in the form of a *nix timestamp in milliseconds. This property is read-only and is generated by the system.
                        creator:
                          title: Creator user ID
                          type: string
                          readOnly: true
                          example: AAXYAAAAAZ3
                          description: User ID of the user who created this SLO. This property is read-only and is generated by the system.
                        id:
                          title: ID of the SLO
                          type: string
                          readOnly: true
                          example: FrvcMakAAAA
                          description: ID of the SLO. This property is read-only and is generated by the system.
                        description:
                          title: Description of the SLO
                          type: string
                          example: My SLO test
                          description: Description of the SLO
                        name:
                          title: Name of the SLO
                          type: string
                          example: Test SLO
                          description: Name of the SLO. Each SLO name must be unique within an organization
                        type:
                          title: Type of SLO
                          type: string
                          enum:
                          - RequestBased
                          description: 'Type of the SLO. You can configure your SLO as the following type:


                            Request-based SLO: Measurement tracks the successful request count and total request count'
                        inputs:
                          title: SLO inputs
                          oneOf:
                          - title: Request Based Input SLO Type
                            type: object
                            required:
                            - programText
                            - totalEventsLabel
                            - goodEventsLabel
                            properties:
                              programText:
                                type: string
                                example: 'A = data(''spans.count'', filter(''sf_error'', ''false''))

                                  B = data(''spans.count'')

                                  '
                                description: SignalFlow program and arguments text strings that define the streams used as successful event count and total event count
                              totalEventsLabel:
                                type: string
                                example: B
                                description: Label used in programText that refers to the data block which contains the stream of total events
                              goodEventsLabel:
                                type: string
                                example: A
                                description: Label used in programText that refers to the data block which contains the stream of successful events
                            description: Properties to congifure an SLO object configured request-based inputs
                          example:
                            programText: 'A = data(''spans.count'', filter(''sf_error'', ''false''))

                              B = data(''spans.count'')

                              '
                            goodEventsLabel: A
                            totalEventsLabel: B
                          description: Inputs to configure your SLO
                        targets:
