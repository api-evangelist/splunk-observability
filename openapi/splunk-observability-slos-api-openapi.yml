                          type: number
                          format: double
                          example: 99.99
                          description: Target value in the form of a percentage
                          exclusiveMinimum: 0
                          exclusiveMaximum: 100
                        type:
                          type: string
                          enum:
                          - RollingWindow
                          - CalendarWindow
                          example: RollingWindow
                          description: 'SLO target can be the following type:


                            RollingWindow

                            CalendarWindow'
                        sloAlertRules:
                          type: array
                          items:
                            title: SLO Alert Rule Object
                            type: object
                            required:
                            - type
