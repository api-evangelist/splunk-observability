    put:
      summary: Update Existing SLO
      description: 'Updates the SLO for the ID specified in the {id} path parameter.

        The PUT /slo/{id} operation has overwrite semantics:


        For read-write properties, if the value is already specified, a new value in the request body overwrites it.

        For read-write properties, if the value is already specified, and you don''t modify it, the API updates the property with the default value. For example, if you don''t provide values for description, the updated SLO has an empty array for description.


        Because of these semantics, follow these steps to explicitly preserve existing values:


        Send a GET /slo/{id} request to retrieve the existing SLO property values.

        Update any read-write properties in the response body with the new values you want to use.

        Use the response body as the request body in the PUT /slo/{id} operation to update the SLO.'
      parameters:
      - name: id
        in: path
        description: ID of the SLO you want to update
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Request body format. Always "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Update SLO Request Body
              type: object
              required:
              - name
              - type
              - inputs
              - targets
              properties:
                description:
                  title: Description of the SLO
                  type: string
                  example: My SLO test
                  description: Description of the SLO
                name:
                  title: Name of the SLO
                  type: string
                  example: Test SLO
                  description: Name of the SLO. Each SLO name must be unique within an organization
                type:
                  title: Type of SLO
                  type: string
                  enum:
                  - RequestBased
                  description: 'Type of the SLO. You can configure your SLO as the following type:


                    Request-based SLO: Measurement tracks the successful request count and total request count'
                inputs:
                  title: SLO inputs
                  oneOf:
                  - title: Request Based Input SLO Type
                    type: object
                    required:
                    - programText
                    - totalEventsLabel
                    - goodEventsLabel
                    properties:
                      programText:
                        type: string
                        example: 'A = data(''spans.count'', filter(''sf_error'', ''false''))

                          B = data(''spans.count'')

                          '
                        description: SignalFlow program and arguments text strings that define the streams used as successful event count and total event count
                      totalEventsLabel:
                        type: string
                        example: B
                        description: Label used in programText that refers to the data block which contains the stream of total events
                      goodEventsLabel:
                        type: string
                        example: A
                        description: Label used in programText that refers to the data block which contains the stream of successful events
                    description: Properties to congifure an SLO object configured request-based inputs
                  example:
                    programText: 'A = data(''spans.count'', filter(''sf_error'', ''false''))

                      B = data(''spans.count'')

                      '
                    goodEventsLabel: A
                    totalEventsLabel: B
                  description: Inputs to configure your SLO
                targets:
                  title: SLO target array
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    title: SLO Target
                    type: object
                    required:
                    - compliancePeriod
                    - cycleType
                    - cycleStart
                    - slo
                    - type
                    - sloAlertRules
                    properties:
                      compliancePeriod:
                        type: string
                        example: 30d
                        description: Compliance period of this SLO. This value must be within the range of 1d (1 day) to 30d (30 days), inclusive.
                      cycleType:
                        type: string
                        enum:
                        - week
                        - month
                        example: week
                        description: 'Cycle type for this SLO target, either week or month.

                          Note: Required only when SLO target type is CalendarWindow.'
                      cycleStart:
                        type: string
                        example: monday
                        description: 'Starting point for the cycle of this SLO target.

