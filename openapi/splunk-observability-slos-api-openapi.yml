  /slo/validate:
    post:
      summary: Validate SLO Definition
      description: 'Checks an SLO request body to see if it''s valid, but

        doesn''t actually create an SLO. This operation doesn''t return a

        response body.'
      parameters:
      - name: Content-Type
        in: header
        description: Format of the request body. Always "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Validate SLO Request Body
              type: object
              required:
              - name
              - type
              - inputs
              - targets
              properties:
                description:
                  title: Description of the SLO
                  type: string
                  example: My SLO test
                  description: Description of the SLO
                name:
                  title: Name of the SLO
                  type: string
                  example: Test SLO
                  description: Name of the SLO. Each SLO name must be unique within an organization
                type:
                  title: Type of SLO
                  type: string
                  enum:
                  - RequestBased
                  description: 'Type of the SLO. You can configure your SLO as the following type:


                    Request-based SLO: Measurement tracks the successful request count and total request count'
                inputs:
                  title: SLO inputs
                  oneOf:
                  - title: Request Based Input SLO Type
                    type: object
                    required:
                    - programText
                    - totalEventsLabel
                    - goodEventsLabel
                    properties:
                      programText:
                        type: string
                        example: 'A = data(''spans.count'', filter(''sf_error'', ''false''))

                          B = data(''spans.count'')

                          '
