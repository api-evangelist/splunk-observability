                                description: 'SLO alert rule can be one of the following types:


                                  BREACH: Alerts when the service level indicator (SLI) doesn’t meet the target over the specified compliance window.

                                  ERROR_BUDGET_LEFT: Alerts when the remaining error budget is less than the specified percentage of the estimated error budget for the compliance window.

                                  BURN_RATE: Alerts when the rate of consumption of your SLO error budget exceeds a healthy threshold for the specified compliance window.


                                  Note: Within an SLO object, you can only specify one SLO alert rule per type. For example, you can''t specify two objects of type BREACH in the same sloAlertRules list.'
