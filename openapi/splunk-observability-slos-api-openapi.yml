                                    title: Parameters for SLO alert rule
                                    type: object
                                    properties:
                                      fireLasting:
                                        type: string
                                        default: 5m
                                        example: 5m
                                        description: 'Duration that indicates how long the alert condition is met before the alert is triggered. The value must be positive and smaller than the compliance period of the SLO target.

                                          Note: BREACH and ERROR_BUDGET_LEFT alert rules use the fireLasting parameter.'
                                      percentOfLasting:
                                        type: number
                                        format: double
                                        maximum: 100
                                        default: 100
                                        example: 100
                                        description: 'Percentage of the fireLasting duration that the alert condition is met before the alert is triggered.

                                          Note: BREACH and ERROR_BUDGET_LEFT alert rules use the percentOfLasting parameter'
                                        exclusiveMinimum: 0
                                      percentErrorBudgetLeft:
                                        title: Percent Error Budget Left Parameter
                                        type: number
                                        format: double
                                        maximum: 100
                                        default: 10
                                        example: 10
                                        description: 'Error budget must be equal to or smaller than this percentage for the alert to be triggered.

                                          Note: ERROR_BUDGET_LEFT alert rules use the percentErrorBudgetLeft parameter'
                                        exclusiveMinimum: 0
                                      shortWindow1:
                                        title: Short Window 1 Parameter
                                        type: string
                                        default: 5m
                                        example: 5m
                                        description: 'Short window 1 used in burn rate alert calculation. This value must be longer than 1/30 of longWindow1.

                                          Note: BURN_RATE alert rules use the shortWindow1 parameter'
                                      longWindow1:
                                        title: Long Window 1 Parameter
                                        type: string
                                        default: 1h
                                        example: 1h
                                        description: 'Long window 1 used in burn rate alert calculation. This value must be longer than shortWindow1 and shorter than 90 days.

                                          Note: BURN_RATE alert rules use the longWindow1 parameter'
                                      shortWindow2:
                                        title: Short Window 2 Parameter
                                        type: string
                                        default: 30m
                                        example: 30m
                                        description: 'Short window 2 used in burn rate alert calculation. This value must be longer than 1/30 of longWindow2.

                                          Note: shortWindow2 parameter is used only in BURN_RATE alert rules.'
                                      longWindow2:
                                        title: Long Window 2 Parameter
                                        type: string
                                        default: 6h
                                        example: 6h
                                        description: 'Long window 2 used in burn rate alert calculation. This value must be longer than shortWindow2 and shorter than 90 days.

                                          Note: BURN_RATE alert rules use the longWindow2 parameter'
                                      burnRateThreshold1:
                                        title: Burn Rate Threshold 1 Parameter
                                        type: number
                                        format: double
                                        example: 14.4
                                        description: 'Burn rate threshold 1 used in burn rate alert calculation. This value must be between 0 and 100/(100-SLO target).

                                          Note: BURN_RATE alert rules use the burnRateThreshold1 parameter'
                                      burnRateThreshold2:
                                        title: Burn Rate Threshold 2 Parameter
                                        type: number
                                        format: double
                                        example: 6
                                        description: 'Burn rate threshold 2 used in burn rate alert calculation. This value must be between 0 and 100/(100-SLO target).

                                          Note: BURN_RATE alert rules use the burnRateThreshold2 parameter'
