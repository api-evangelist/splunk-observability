                      title: Rule
                      description: 'The behavior of your tests when this downtime configuration is active. This can be pause_tests or augment_data.


                        pause_tests: Tests will not run while the downtime configuration is active.

                        augment_data: Tests continue to run when the downtime configuration is active, but the data collected includes an additional dimension (under:maintenance:true) to differentiate from the normal test data.'
                    testIds:
                      type: array
                      items:
                        type: integer
                        example: 123
                        title: TestId
                        description: The id of the test belonging to the downtime configuration.
                    startTime:
                      type: string
                      example: '2024-05-03T16:00:00.000Z'
                      title: StartTimePost
                      description: 'Timestamp of when you want the downtime configuration to start, in UTC.


                        startTime cannot be set in the past.

                        startTime cannot be set more than 1 year in the future.'
                    endTime:
                      type: string
                      example: '2024-05-10T16:00:00.000Z'
                      title: EndTimePost
                      description: 'Timestamp of when you want the downtime configuration to end, in UTC.


                        endTime must be at least 15 minutes after the startTime, unless you are cancelling an active downtime configuration.

                        endTime must be no more than 1 year after the startTime.'
                    timezone:
                      type: string
                      example: America/New_York
                      title: Timezone
                      description: IANA timezone in which you want your downtime configuration to be set at. This is required for recurring downtime configurations.
                    recurrence:
