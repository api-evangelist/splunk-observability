                    description: 'Array of notification settings. Each element defines a notification

                      that Splunk Observability Cloud sends when your organization is within 90% of

                      exceeding an org token limit. You can specify more than one object,

                      and each object can be of a different type.

                      To send email notifications, use one of the following types:


                      For one or more individual users, use "type": "Email".

                      For a single team, use "type": "TeamEmail".

                      For multiple teams, use multiple array elements, each with "type": "TeamEmail" and the team ID.

                      To send emails to a team, the team must already exist.


                      Note: "Team" sends notification messages using the team''s

                      notification policy, which may or may not send an email to team members.

                      To learn more, see the description of the "Team" notification type.'
                  orgId:
                    title: Organization ID
                    type: string
                    example: myOrg
                    description: ID of the organization associated with the token.
                  permissions:
                    title: Access control list
                    type:
                    - object
                    - 'null'
                    properties:
                      acl:
                        title: List of access controls for this token
                        type: array
                        minItems: 1
                        items:
                          title: Single access control
                          type: object
                          required:
                          - actions
                          - principalId
                          - principalType
                          properties:
                            actions:
                              title: List of authorizations for an ID
                              type: array
                              minItems: 1
                              maxItems: 2
                              example:
                              - READ
                              - WRITE
                              items:
                                type: string
                                enum:
                                - READ
                                - WRITE
                              description: 'List of authorizations for the ID (principal) specified in the principalId field, in the form of a

                                JSON array of strings. The following values are allowed:


                                READ: The principal can view the token, but can''t modify it.

                                WRITE: The principal can view the token and update it.


                                The token is only visible to users or teams that you specify in the access control list. However, if you specify

                                "principalType": "ORG", the token is visible to everyone in the organization.

                                If you specify "actions": null, Splunk Observability Cloud returns HTTP response code 400, indicating that

                                actions can''t be null.'
                            principalId:
                              title: ID of an Splunk Observability Cloud user or organization
                              type: string
                              example: X_xxxx9XXXX
                              description: The Splunk Observability Cloud-assigned ID of a user or organization
                            principalType:
                              title: Type of ID specified by the `principalId` field
                              type: string
                              enum:
                              - USER
                              - ORG
                              - TEAM
                              example: USER
                              description: 'String that describes the type of ID specified in the principalId field.

                                Splunk Observability Cloud accepts the following values for principalType:


                                USER: principalId represents an individual user

                                TEAM: principalId represents an Splunk Observability Cloud team

                                ORG: principalId represents the entire organization


                                If you set "principalType": null, Splunk Observability Cloud returns HTTP response code 400, indicating that

                                principalType can''t be null.'
                          description: Describes the authorizations for the ID specified by the principalId and principalType fields.
                        description: 'List of access controls, in the form of a JSON array of JSON objects. If you specify "acl": null,

                          Splunk Observability Cloud returns HTTP response code 400 indicating that acl can''t be null.'
                      parent:
                        type: string
                        title: PermissionParent
                        description: 'Not used. Splunk Observability Cloud ignores values you specify. In response bodies, the

                          field value is always null.'
                    description: 'List of authorizations for this org token, in the form of a JSON array

                      of JSON objects. Each object specifies an authorization, the ID that can perform the action,

                      and the type of ID.

                      If you specify null for the value of permissions, Splunk Observability Cloud takes the

                      following actions:


                      POST /v2/token: Only admin users can access the token.

                      PUT /v2/token: Splunk Observability Cloud removes all permissions for the token.'
                  roles:
                    title: Current roles associated with the token
                    type: array
                    items:
                      title: Token roles items
                      properties:
                        capabilities:
                          type: array
                          items:
                            type: array
                            items:
                              type: string
                              example: CREATE_DASHBOARD
                          description: List of capabilities associated with the token's role.
                        created:
                          type: string
                          example: 232329
                          description: 'Time of creation, in milliseconds.

                            This value is set by the system, and you can''t change it.'
                        creator:
                          type: string
                          example: user1
                          description: 'User who created the role, if applicable.

                            This value is set by the system, and you can''t change it.'
                        description:
                          type: string
                          example: Built-in power role
                          description: Description of the token's role.
                        id:
                          type: string
                          example: abcd1234
                          description: ID of the associated token role.
                        immutable:
                          type: boolean
                          example: true
                          description: Whether the token's role is immutable. Immutable roles can't be edited.
                        lastUpdated:
                          type: string
                          example: 34343
                          description: 'Time of the most recent update, in milliseconds.

                            This value is set by the system, and you can''t change it.'
                        lastUpdatedBy:
                          type: string
                          example: User1
                          description: 'The user who most recently updated the role.

                            This value is set by the system, and you can''t change it.'
                        organizationId:
                          type: string
                          example: F2394DY
                          description: ID of the organization that's associated with this role.
                        title:
                          type: string
                          enum:
                          - power
                          - usage
                          - read_only
                          example: power
                          description: Name of the token's role. Tokens can have the "power", "usage", or "read_only" roles.
                      description: Values for the roles field of the GET, PUT, and POST endpoints for access tokens.
                    description: List of roles associated with the token.
                  secret:
                    title: Current authentication secret for the token
                    type: string
                    readOnly: true
                    description: 'Authentication secret used to send requests to Splunk Observability Cloud.

                      The system sets this value, and you can''t modify it.'
                  name:
                    title: Name (displayed)
                    type: string
                    minLength: 1
                    readOnly: false
                    writeOnly: false
                    description: Displayed name of the org token in the UI.
                  authScopes:
                    title: Authorization scope
                    type: array
                    items:
                      type: string
                      enum:
                      - API
                      - INGEST
                      - RUM
                    description: 'The type of endpoint for which the token is authorized. Authorization scopes cannot be updated.

                      Note: Assign only one authorization scope to a token. Applying both the API and INGEST authorization scopes to the same token might raise a security concern.

                      Splunk Observability Cloud accepts the following values for the authScopes field:


                      API: Use this authorization scope for the token to authenticate with Infrastructure Monitoring endpoints. Example use cases are Terraform, programmatic usage of the API for business objects, and so on. These endpoints use the following base URLs:


                      https://api.<REALM>.observability.splunkcloud.com

                      wss://stream.<REALM>.observability.splunkcloud.com


                      To learn more, see Summary of Splunk Observability Cloud API Endpoints.


                      INGEST: Use this authorization scope for the token to authenticate with data ingestion endpoints. These endpoints use the following base URLs:


                      POST https://ingest.<REALM>.observability.splunkcloud.com/v2/datapoint

                      POST https://ingest.<REALM>.observability.splunkcloud.com/v2/event

                      POST https://ingest.<REALM>.observability.splunkcloud.com/v1/trace


                      To learn more, see Send Monitoring Metrics and Custom Events.


                      RUM: Use this authorization scope for the token to authenticate with RUM ingestion endpoints. These endpoints use the following base URL: https://rum-ingest.<REALM>.observability.splunkcloud.com/v1/rum.

                      Note: RUM displays the RUM token in URIs that are visible in a browser. To preserve security, you can''t assign the INGEST or API authorization scope to a RUM token.'
