                  message:
                    title: Error message
                    type: string
                    example: Please provide a name for this token.
                    description: 'Cause of the error. The following list describes the error message and its cause:


                      Please provide a name for this token.: In the request body, the name field is missing or null.

                      Unable to create or update the given token. Please try again later.: An internal error occurred, and Splunk Observability Cloud can''t create the token.

                      A token with the same name already exists!: For a POST request, you specified a value for name that''s the same as the name of an existing token.

                      DPM quota cannot be set on a Hosts subscription plan: Your organization uses host-based pricing, but you tried to set a DPM limit.

                      Category quota cannot be set on a DPM subscription plan: Your organization uses DPM-based pricing, but you tried to set a host-based limit.

                      Host/Container quota cannot be set on a MTS subscription plan: Your organization uses custom metric-based pricing, but you tried

                      to set a host or container limit.

                      A principalId is required and may not be empty for acl entry: Problem with a field in permissions -- principalId is either missing or empty.

                      One or more of provided users could not be validated [<principal_id_value]: Problem with a field in permissions -- The value of principalId

                      isn''t an existing user, team, or org ID.

                      Permissions are required with one (and only one) of permission types present. Either provide custom ACL for this object or PARENT ID from which permissions should be inherited.

                      Problem with a field in permissions -- The value of acl is null.

                      Actions are required and may not be empty for acl entry: Problem with a field in permissions -- The value of actions in acl is null.

                      A principalType is required and may not be empty for acl entry: Problem with a field in permissions -- principalType is either missing or empty.

                      Failed to deserialize payload at: sf.rest.shared.model.NamedToken[\"permissions\"]->sf.domain.accesscontrol.ObjectPermissions[\"acl\"]->java.util.HashSet[0]->sf.domain.accesscontrol.AclEntry[\"actions\"]->java.util.HashSet[0]:

                      Problem with a field in permissions -- The value of the actions field isn''t READ or WRITE.

                      Failed to deserialize payload at: sf.rest.shared.model.NamedToken[\"permissions\"]->sf.domain.accesscontrol.ObjectPermissions[\"acl\"]->java.util.HashSet[0]->sf.domain.accesscontrol.AclEntry[\"principalType\"]

                      Problem with a field in permissions -- The value of the principalType field isn''t USER, TEAM, or ORG.'
