  /token/{name}/rotate:
    post:
      summary: Rotate Token Secret
      description: 'Generates a new token secret for the token specified by the name path

        parameter, and de-authorizes the previous token secret. You can also

        define a grace period for the previous token before it expires. During the grace period,

        both the old and new token secrets are authorized for the token.

        For example: https://api.{realm}.observability.splunkcloud.com/v2/token/{name}/rotate?graceful=5184000

        Note: You can''t rotate a token that is past its expiration date.

        You have to have the Splunk Observability Cloud admin role to use this endpoint.'
      parameters:
      - name: name
        in: path
        description: Name of the org token you want to update with a new secret
        required: true
        schema:
          type: string
      - name: graceful
        in: query
        description: 'Time interval, in seconds, during which the old secret continues to

          function. After the time expires, the API rejects requests using

          the old secret. If you don''t specify a value, it defaults to 0,

          and the old secret immediately stops working.

          The maximum allowed interval is 5,184,000 seconds (60 days).'
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 5184000
          example: 5184000
      - name: secondsUntilExpiry
        in: query
        description: 'Time period, in seconds, until the rotated token expires. This time period must be greater than

          0 seconds and less than 18 years (5,676,000,000 seconds).

          If you leave this value unspecified, the API uses the org''s defaultTokenLifespanMs value, which is 30 days by default.

          You can change this default value in the Splunk Observability Cloud access token page.'
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 5676000000
          example: 5184000
      - name: X-SF-TOKEN
        in: header
        description: Authentication token. Must be a session token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                title: Properties of an org access token
                type: object
                properties:
                  created:
                    title: Token creation timestamp
                    type: integer
                    format: int64
                    example: 1556746230000
                    readOnly: true
                    description: 'The token creation date and time, in *nix time in milliseconds.

                      The system sets this value, and you can''t modify it.'
                  creator:
                    type: string
                    readOnly: true
                    description: 'ID of the user that created this token.

                      The system sets this value, and you can''t modify it.'
                  description:
                    title: Token description
                    type: string
                    description: 'Extended description of the token. You assign this value when you

                      create or update the token.'
                  disabled:
                    title: Token disabled flag
                    type: boolean
                    description: 'Flag that controls enabling the token. If set to true, the token

                      is disabled, and you can''t use it for authentication.'
                  exceedingLimits:
                    title: Token exceeding limits flag
                    type: boolean
                    example: false
                    description: Indicates whether the token is exceeding its usage limits. If set to true, the token is exceeding one or more of its usage limits.
                  expiry:
                    title: Token expiration timestamp
                    type: integer
                    format: int64
                    example: 1558474230000
                    readOnly: true
                    description: 'Date and time that the token expires in *nix time in milliseconds.

                      The system sets this value to one year after the creation date, and you can''t modify it.

                      Note: For access tokens that the system created with a five-year lifetime, the original expiration date remains the same.'
                  id:
                    title: Token ID
                    type: string
                    readOnly: true
                    description: 'Token ID

                      The system sets this value, and you can''t modify it.'
                  lastUpdated:
                    type: integer
                    format: int64
                    example: 1557696630000
                    readOnly: true
                    description: 'The date and time that the token was last updated, in

                      *nix time in milliseconds.

                      The system sets this value, and you can''t modify it.'
                  lastUpdatedBy:
                    type: string
                    readOnly: true
                    description: 'ID of the user that last updated this token

                      The system sets this value, and you can''t modify it.'
                  latestRotation:
                    title: Timestamp of latest rotation
                    type: integer
                    format: int64
                    example: 1556832630000
                    readOnly: true
                    description: 'Date and time when Splunk Observability Cloud last rotated the secret for this token,

                      in *nix time in milliseconds.

                      The system sets this value, and you can''t modify it.'
                  limits:
                    title: Limits associated with the org token
                    type: object
                    properties:
                      categoryQuota:
                        title: Usage Limits for usage-based and host-based pricing
                        type: object
                        properties:
                          '1':
                            title: Max number of hosts
                            type: number
                            format: int32
                            description: Max number of hosts that can use this token (ignored for usage-based pricing)
                          '2':
                            title: Max number of Docker containers
