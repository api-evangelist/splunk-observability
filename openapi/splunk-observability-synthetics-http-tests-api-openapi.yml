          application/json:
            schema:
              type: object
              properties:
                test:
                  type: object
                  properties:
                    name:
                      type: string
                      example: My HTTP test
                    automaticRetries:
                      type: integer
                      default: 0
                      example: 1
                      description: Automatically retry if the run fails
                    frequency:
                      type: integer
                      format: int32
                      example: 5
                      title: Frequency
                      description: How often to run your test.
                    schedulingStrategy:
                      type: string
                      example: round_robin
                      title: SchedulingStrategy
                      description: 'Type of scheduling strategy. This can only be:


                        round_robin

                        concurrent'
                    locationIds:
                      type: array
                      items:
                        type: string
                      example:
                      - aws-us-east-1
                      title: LocationIds
                      description: An array of location IDs where the test runs.
                    authentication:
                      type: object
                      properties:
                        username:
                          type: string
                          example: myuser
                        password:
                          type: string
                          example: password123
                      title: Authentication
                    url:
                      type: string
                      example: https://splunk.com
                      description: URL to test
                    active:
                      type: boolean
                      example: true
                    customProperties:
                      type: array
                      items:
                        type: object
                        required:
                        - key
                        - value
                        properties:
                          key:
                            type: string
                            example: Env
                          value:
                            type: string
                            example: production
                      title: CustomProperties
                      description: An array of custom properties.  The section Custom Properties Criteria lists the requirements for custom property names and values.
                    verifyCertificates:
                      type: boolean
                      example: true
                    requestMethod:
                      type: string
                      example: POST
                      title: RequestMethod
                      description: 'Must be one of the following:


                        GET

                        POST

                        PUT

                        PATCH

                        DELETE

                        HEAD

                        OPTIONS'
                    body:
                      type: string
                      example: '''{"alert_name":"the service is

                        down","url":"https://foo.com/bar"}''

                        '
                      title: Body
                    validations:
                      type: array
                      items:
                        anyOf:
                        - type: object
                          properties:
                            type:
                              type: string
                              example: assert_numeric
                              description: 'Type of assertion. Possible values for this are:


                                assert_string

                                assert_numeric'
                            actual:
                              type: string
                              example: '{{response.code}}'
                              description: 'The actual value to validate. This can be any string, a variable, or a metric value. Valid options include:


                                {{response.body}}


                                {{response.code}}


                                {{response.first_byte_time}}


                                {{response.body_size}}


                                {{response.dns_time}}


                                {{response.response_time}}


                                {{headers.<headerName>}}'
                            expected:
                              type: string
                              example: 200
                              description: What you expect the variable to be.
                            comparator:
                              type: string
                              example: equals
                              description: 'Comparator between the actual value and the expected value. Must be

                                one of the following depending on the type:

                                For assert_string:


                                is_empty

                                is_not_empty

                                contains

                                does_not_contain

                                equals

                                does_not_equal

                                matches

                                does_not_match


                                For assert_numeric:


                                is_less_than

                                is_less_than_or_equal_to

                                equals

                                does_not_equal

                                is_greater_than

                                is_greater_than_or_equal_to'
                          title: ValidationAssert
                          description: Validation step to assert response value, response header, or response body.
