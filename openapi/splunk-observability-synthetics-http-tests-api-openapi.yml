                      example: Mozilla/5.0 (iPhone13,2; U; CPU iPhone OS 14_0 like Mac OS X) AppleWebKit/602.1.50 (KHTML, like Gecko) Version/10.0 Mobile/15E148 Safari/602.1
                      title: UserAgent
                      description: Configure the User-Agent HTTP header
                    port:
                      type:
                      - integer
                      - 'null'
                      format: int32
                      minimum: 0
                      maximum: 65535
                      example: 3000
                      title: PortSchema
                      description: Port number from 0-65535. Can be null.
                    certificateId:
                      type:
                      - integer
                      - 'null'
                      format: int64
                      example: 1
                      title: CertificateId
                      description: The unique ID of the client certificate.
              title: HttpTestValidateRequest
              description: Request body to validate HTTP tests.
            examples:
              example:
                value:
                  test:
                    active: true
                    authentication:
                      password: password123
                      username: myuser
                    automaticRetries: 1
                    body: '''{"alert_name":"the service is

                      down","url":"https://foo.com/bar"}''

                      '
                    certificateId: 1
                    customProperties:
                    - key: Env
                      value: production
                    frequency: 5
                    locationIds:
                    - aws-us-east-1
                    name: My HTTP test
                    port: 3000
                    requestMethod: POST
                    schedulingStrategy: round_robin
                    url: https://splunk.com
                    userAgent: Mozilla/5.0 (iPhone13,2; U; CPU iPhone OS 14_0 like Mac OS X) AppleWebKit/602.1.50 (KHTML, like Gecko) Version/10.0 Mobile/15E148 Safari/602.1
                    validations:
                    - actual: '{{response.code}}'
                      comparator: equals
                      expected: 200
                      type: assert_numeric
                    verifyCertificates: true
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: HTTP test is not valid
                  details:
                    type: object
                    properties:
                      url:
                        type: array
                        items:
                          type: string
                          example: must be a valid URL
                    description: 'Details of why HTTP test is invalid. The url key in the example is

                      dynamic. If url is invalid, the key will be url. If frequency

                      is invalid, there will be a frequency key.

                      If the test is valid, this details field will be an empty array.'
                title: ValidateHttpTestResponse
                description: Response body for validating an HTTP test.
              examples:
                example:
                  value:
                    details:
                      url:
                      - must be a valid URL
                    message: HTTP test is not valid
                    valid: false
      security:
      - SessionToken: []
      tags:
      - Synthetics HTTP tests
components:
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-SF-Token
      description: Splunk Observability Cloud session token or org access token.
