        The PUT /navigator/{id} operation has overwrite semantics:


        For read-write properties, if the value is already specified, a new value in the request body overwrites it.

        For read-write properties, if the value is already specified, and you don''t specify a value for it, the API updates the property with the default value. For example, if you don''t provide values for listColumns, the updated navigator has an empty array for listColumns.


        Because of these semantics, follow these steps to explicitly preserve existing values:


        Send a GET /navigator/{id} request to retrieve the existing navigator property values.

        Update any read-write properties in the response body with the new values you want to use.

        Use the response body as the request body in the PUT /navigator/{id} operation to update the navigator.


        Note: You must be an admin to update a navigator.'
