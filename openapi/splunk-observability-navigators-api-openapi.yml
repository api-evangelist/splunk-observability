  /navigator/{id}/navigatorcustomization:
    get:
      summary: Retrieve All Navigator Customizations
      description: Retrieves the properties of all navigator customization objects associated with the navigator ID specified in the {id} path parameter.
      parameters:
      - name: id
        in: path
        description: ID of the navigator you want to retrieve.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Number of navigators to retrieve from the list of navigators that match your search criteria.
        schema:
          type: integer
          format: int32
          default: 200
          example: 100
      - name: offset
        in: query
        description: 0-based index of the point in the query results where the system starts returning navigators. If the offset value is greater than the size of the result set, you don't receive any results.
        schema:
          type: integer
          format: int32
      - name: orderBy
        in: query
        description: The field on which the API should sort the query results. The API only supports fields specified in the enum.
        schema:
          type: string
          enum:
          - creator
          - created
          - lastUpdated
          - lastUpdatedBy
          default: lastUpdated
      - name: Accept
        in: header
        description: Format of the response body. Always "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                title: Valid Get All Navigator Customizations Response
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                    description: 'Number of navigators that matched the provided search criteria.

                      Note: This value is the total number of matches, not the number of navigators returned. The number of navigators that the system returns is affected by the limit and offset query parameters.

                      In summary:


                      sizeOf(results): Number of navigators returned in the response body.

                      count: Number of navigators that match the search criteria.'
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        created:
                          title: Date and time when this navigator customization was created
                          type: integer
                          format: int64
                          readOnly: true
                          example: 1771192844528
                          description: Date and time the navigator customization was created, in the form of a *nix timestamp in milliseconds. This property is read-only and is generated by the system.
                        creator:
                          title: Navigator customization creator user ID
                          type: string
                          readOnly: true
                          example: FBBVcWRNUPP
                          description: User ID of the user who created this navigator customization. This property is read-only and is generated by the system.
                        lastUpdated:
                          title: Navigator customization last updated time
                          type: integer
                          format: int64
                          readOnly: true
                          example: 1771192844528
                          description: Date and time the navigator customization was last updated, in the form of a *nix timestamp in milliseconds. This property is read-only and is generated by the system.
                        lastUpdatedBy:
                          title: User who last updated this navigator customization
                          type: string
                          readOnly: true
                          example: FBBVcWRNUPP
                          description: User ID of the user who last updated this navigator customization. This property is read-only and is generated by the system.
                        id:
                          title: Navigator customization system ID
                          type: string
                          readOnly: true
                          example: F4vLmvyAwAb
                          description: The UUID of this navigator customization object. This property is read-only and is generated by the system.
                        name:
                          title: Navigator customization display name
                          type: string
                          maxLength: 150
                          example: Customization for AWS EC2 from 2023-08-23 22:45:45
                          description: Required. A name for the navigator customization that appears in the UI.
                        navigatorId:
                          title: Navigator system ID
                          type: string
                          readOnly: true
                          example: F4To0t7AEAA
                          description: The ID of the navigator that you want to customize. This property is read-only and is generated by the system.
                        aggregateDashboards:
                          title: Dashboard ID array for aggregate display
                          type: array
                          maxItems: 10
                          items:
                            type: string
                          example:
                          - id: F4MX9uNAYDE
                            hidden: false
                          - id: F5MA9uTAYFE
                            hidden: true
                          - '...'
                          description: 'An ordered list of dashboard IDs to display in the aggregate view of the navigator. Can be used to reorder dashboards, add custom dashboards, and hide existing built-in dashboards.

                            Built-in dashboards can be marked as hidden, but not removed from the list.

