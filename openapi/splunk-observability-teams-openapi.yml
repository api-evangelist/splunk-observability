        in: header
        description: 'Authentication token. Must be a session token (User API access token)

          for an administrator.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: HTTP 204 response
      security:
      - SessionToken: []
      tags:
      - Teams
  /team/{tid}/member/{uid}:
    put:
      summary: Update Team Membership User Id
      description: 'Updates the team specified by the {tid} path parameter by adding the user

        specified by the {uid} path parameter.

        Notes:


        Although this is a PUT method, it doesn''t have overwrite semantics. Instead, the

        specified user is added to the existing team without any other updates.

        This method doesn''t have a request body.'
      parameters:
      - name: tid
        in: path
        description: ID of an existing team
        required: true
        schema:
          type: string
      - name: uid
        in: path
        description: 'ID, assigned by Splunk Observability Cloud, for a user you want

          to add to the team specified by {tid}'
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: 'Authentication token. Must be a session token (User API access token)

          for an administrator.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: HTTP 204 response
        '403':
          description: HTTP 403 response
      security:
      - SessionToken: []
      tags:
      - Teams
    delete:
      summary: Delete Team User User Id
      description: 'Deletes the user specifed by the {uid} path parameter from the

        team specified by the {tid} path parameter'
      parameters:
      - name: id
        in: path
        description: ID of an existing team
        required: true
        schema:
          type: string
      - name: uid
        in: path
        description: 'ID, assigned by Splunk Observability Cloud, for a user you want

          to add to the team specified by {tid}'
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: 'Authentication token. Must be a session token (User API access token)

          for an administrator.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: HTTP 204 response
        '400':
          description: HTTP 400 response
      security:
      - SessionToken: []
      tags:
      - Teams
  /team/{tid}/members:
    put:
      summary: Add Team Member List
      description: 'Adds new members to the team specified by the {tid} path parameter.

        This endpoint doesn''t overwrite existing team members.'
      parameters:
      - name: id
        in: path
        description: ID of an existing team
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Format of the request body. Always  "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: 'Authentication token. Must be a session token (User API access token)

          for an administrator.'
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: array
                  items:
                    type: string
                    description: User ID of a team member to add to the team
                  example:
                  - XxXXxXXXXXX
                  - YyYYyYYYYYY
                  - ZzZZzZZZZZZ
                  description: 'List of one or more Splunk Observability Cloud-assigned user IDs to add to the team,

                    in the form of a JSON array of strings'
            examples:
              example:
                value:
                  members:
                  - XxXXxXXXXXX
                  - YyYYyYYYYYY
                  - ZzZZzZZZZZZ
      responses:
        '204':
          description: HTTP 204 response
      security:
      - SessionToken: []
      tags:
      - Teams
    delete:
