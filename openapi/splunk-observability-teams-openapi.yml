                                type: string
                                readOnly: false
                                writeOnly: false
                                example: AmazonEventBridge
                                description: 'Tells Splunk Observability Cloud which system it should use to send the

                                  notification. To select Amazon EventBridge as the notification system, set "type": "AmazonEventBridge".'
                              credentialId:
                                type: string
                                readOnly: false
                                writeOnly: false
