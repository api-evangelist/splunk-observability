                      lists that Splunk Observability Cloud uses to send alert messages for an alerting rule or org token

                      threshold. Each list has the form of a JSON array of objects.

                      Alerting rules specify a severity, and Splunk Observability Cloud uses the team

                      notification policy for that severity when it sends a message. You can

                      specify a list of notification services for each severity.

                      To send email notifications:


                      The team must already exist.

                      For one or more individual users, use "type": "Email".

                      For a single team, use "type": "TeamEmail".

                      For multiple teams, use multiple list objects, each with "type": "TeamEmail" and the team ID.


                      Note: Only team members and administrators can update this list.'
