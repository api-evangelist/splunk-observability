    put:
      summary: updateSingleClientCertificate
      description: 'Update an existing client certificate

        Requirements


        You must have an organization access token with the API permission or a session token to use the API.

        You need the Splunk Observability Cloud admin or power role.'
      parameters:
      - name: id
        in: path
        description: The ID of the client certificate you are updating
        required: true
        schema:
          type: integer
          example: 1
      - name: Content-Type
        in: header
        description: Format of the request body. Always  "application/json".
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Certificate
              required:
              - name
              - domain
              - createdAt
              - updatedAt
              - createdBy
              - updatedBy
              - publicKey
              - privateKey
              properties:
                name:
                  type: string
                  example: foo
                  title: CertificateName
                  description: The name of your client certificate.
                domain:
                  type: string
                  example: app.us1.observability.splunkcloud.com
                  title: CertificateDomain
                  description: The domain of your client certificate.
                description:
                  type: string
                  example: My awesome client certificate
                  title: CertificateDescription
                  description: The description of your client certificate.
                createdAt:
                  type: string
                  readOnly: true
                  example: '2022-09-14T14:35:37.801Z'
                  title: CreatedAt
                  description: 'Timestamp of when the item was created, in UTC.

                    This field is read_only, and the system always sets the value.'
                updatedAt:
                  type: string
                  readOnly: true
                  example: '2022-09-14T14:35:38.099Z'
                  title: UpdatedAt
                  description: 'Timestamp of when the item was last updated, in UTC.

                    This field is read_only, and the system always sets the value.'
                createdBy:
                  type: string
                  readOnly: true
                  example: abcdefgh1234
                  title: CreatedBy
                  description: 'Member ID of who created the item.

                    This field is read-only, and the system always sets the value.'
                updatedBy:
                  type: string
                  readOnly: true
                  example: abcdefgh1234
                  title: UpdatedBy
                  description: 'Member ID of who last updated the item.

                    This field is read-only, and the system always sets the value.'
                publicKey:
                  type: object
                  required:
                  - content
                  - fileExtension
                  - filename
                  properties:
                    content:
                      type: string
                      example: '"QmFnIEF0dHJpYnV0ZXMKICAgIGxvY2FsS2V5SUQ6IEY0IEVGIEVFIDU3IDE4IEU4IDE3IDczIEZBIDQ0IDI2IDZEIERCBFTkNSWVBURUQgUFJJVkFURSBLRVktLS0tLQo="

                        '
                      description: The public key content encoded in Base64.
                    fileExtension:
                      type: string
                      example: pem
                      description: The file extension of the key.
                    filename:
                      type: string
                      example: my_cert.pem
                      description: The filename of the key.
                  title: CertificatePublicKey
                privateKey:
                  title: CertificatePrivateKey
                  properties:
                    content:
                      type: string
                      example: '"QmFnIEF0dHJpYnV0ZXMKICAgIGxvY2FsS2V5SUQ6IEY0IEVGIEVFIDU3IDE4IEU4IDE3IDczIEZBIDQ0IDI2IDZEIERFIDVEIEExIDIwjdjPQotLS0tLUVORCBFTkNSWVBURUQgUFJJVkFURSBLRVktLS0tLQo="

                        '
                      description: The private key content encoded in Base64.
                    fileExtension:
                      type: string
                      example: pem
                      description: The file extension of the key.
                    filename:
                      type: string
                      example: my_cert.pem
                      description: The filename of the key.
                    password:
                      type: string
                      example: my_password
                      description: The password of the private key.
