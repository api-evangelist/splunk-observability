                              Note: The specified type for start is string, but the

                              system also accepts a 64-bit signed integer >= 0 that represents a

                              time in *nix time in milliseconds.'
                        description: 'Time range to show in all of the charts in the dashboard, in the

                          form of a JSON object. The specifications in this object override

                          those in each individual chart. If you don''t specify values, the

                          system defaults to using the individual time setting for each chart.'
                      variables:
                        type: array
                        items:
                          title: Filter that appears in the UI
                          type: object
                          required:
                          - property
                          - value
                          properties:
                            alias:
                              type: string
                              example: Europe
                              description: 'A label for the filter. The system displays this label in the area

                                preceding the input textarea for the filter in the UI.

                                Note: A good way to indicate that the string is a label is to

                                append a space and a colon (":") to it.'
                            preferredSuggestions:
                              type: array
                              items:
                                type: string
                              example:
                              - Europe
                              - Asia
                              description: 'List of strings containing values to place at the top of the

                                Suggested Values dropdown in UI for the dashboard, in the

                                form of a JSON array. If ChartsWebUIFilter.restricted is true,

                                the filter must use one of the values in this array; users only have

                                a choice of selecting a value from this array.'
                            property:
                              type: string
                              example: datacenter
                              description: 'Name of a custom property or dimension to filter against.

                                Note: If the dimension or custom property doesn''t exist in any

                                of the charts in the dashboard, the system doesn''t display any

                                data in the charts.'
                            required:
                              type: boolean
                              default: false
                              example: true
                              description: 'Flag that controls the display of chart data. If true, users must

                                use this filter in order to see data; otherwise, users can delete

                                the filter.'
                            restricted:
                              type: boolean
                              default: false
                              example: true
                              description: 'Flag that controls the values allowed in the filter. If true, the

                                only allowable values are those specified in the

                                ChartsWebUIFilter.preferredSuggestions array; otherwise, any value

                                is allowed.'
                            value:
                              type: array
                              items:
                                type: string
                              example:
                              - London
                              - Paris
                              description: 'A list of values to compare to the value of the dimension or custom

                                property specified in ChartsWebUIFilter.property. If the list

                                contains more than one value, the filter becomes a set of queries

                                between the value of property and each element of value. The

                                system joins these queries with an implicit OR.'
                          description: 'The specification for a filter that appears in the UI. The filter

                            compares the value of a dimension or custom property to a value

                            specified in this filter. You can specify the following in the

                            filter:


                            A default value

                            A list of suggested values to display in the UI

                            A flag that controls user input; if set to true, users are limited

                            to the default and suggested values.


                            You can also force users to choose this filter in order to see data

                            in the charts of this dashboard.'
                        description: 'List of UI-oriented filters that appear at the top of the

                          dashboard, in the form of a JSON array of JSON objects. For each

                          filter you can specify a name and a label for the dimension or

                          custom property to filter against, a list of suggested comparison

                          values to display in the UI, and other properties that control

                          the UI display. To see a more detailed description of the

                          options, see the property descriptions for the ChartsWebUIFilter

                          model.'
                    description: 'Specifies the properties of filters to apply to the dashboard.

                      Filters give you fine-grained control over the data displayed in the

                      charts in the dashboard. You can specify ad hoc filters or save them

                      as variables for repeated use of the filter criteria.

                      You can also use filters to apply a custom time window to all of the

                      charts in the dashboard.'
                  groupId:
                    type: string
                    example: YYXXYY
                    title: DashboardGroupId
                    description: 'ID of an existing dashboard group to associate with this dashboard. If

                      you don''t specify a value, the system creates a new dashboard group and

                      assigns its ID to this property during the create process.'
                  id:
                    type: string
                    example: ZZZXXXX
                    title: DashboardId
                    description: 'The ID of the dashboard. This value is read-only for a

                      create request. Splunk Observability Cloud assigns it and returns it to you in the

                      response.'
                  lastUpdated:
                    type: integer
                    format: int64
                    example: 1647990000000
                    title: DashboardLastUpdated
                    description: 'The last time the dashboard was updated, in *nix time in milliseconds.

                      The system sets this value, and you can''t modify it.'
                  lastUpdatedBy:
                    type: string
                    example: XXXX888
                    title: DashboardLastUpdatedBy
                    description: 'ID of the last user who updated the dashboard. If the

                      last update was by Splunk Observability Cloud, the value is AAAAAAAAAA. This value is

                      read-only.'
                  maxDelayOverride:
                    type: integer
                    format: int32
                    example: 1000
                    title: DashboardMaxDelayOverride
                    description: 'Milliseconds to wait for late-arriving data points before rejecting them

                      for inclusion in the charts in this dashboard. This value overrides

                      but doesn''t change the max delay setting for individual charts in the

                      dashboard. If you omit this property, the system uses individual chart

                      settings.

                      For individual charts, you can force the system to

                      calculate a sensible value by removing the maxDelayOverride property

                      of the chart. To force the system to do this for all charts in a dashboard,

                      set CreateDashboardBody.maxDelayOverride to 0.'
                  name:
                    type: string
                    example: Latency
                    title: DashboardName
                    description: 'A human-readable label for the dashboard. The UI displays this label

                      in the dashboard group for the dashboard'
                  selectedEventOverlays:
                    type: array
                    items:
                      title: Event overlay for charts in a dashboard
                      type: object
                      required:
                      - eventSignal
                      properties:
                        eventSignal:
                          title: A search term that selects charts to overlay
                          type: object
                          required:
                          - eventSearchText
                          properties:
                            eventSearchText:
                              type: string
                              example: ValueExceeded
                              description: 'The event name or partial name that the system uses to select events

                                to suggest as overlays on the charts in the dashboard'
                            eventType:
                              type: string
                              enum:
                              - detectorEvents
                              - eventTimeSeries
                              example: detectorEvents
                              description: 'Controls the source of the event. You can specify the following:


                                detectorEvents: Select events that come from a detector

                                eventTimeSeries: Select events that come from a time series


                                The API doesn''t accept other event types.'
                          description: 'A filter that selects charts to overlay with events, based on event

                            names and types'
                        overlayId:
                          type: string
                          example: E5
                          description: 'Unique ID for this event overlay. Use this ID with any element of the

                            selectedEventOverlays property to apply this overlay to a

                            dashboard.

                            Note: The system generates this value if you don''t specify one.'
                        sources:
                          type: array
                          items:
                            properties:
                              NOT:
                                type: boolean
                                default: false
                                example: false
                                description: 'Controls the action of the filter. If set to true, then the system

                                  only selects events that don''t match the filter.'
                              property:
                                type: string
                                example: datacenter
                                description: 'The custom property or dimension name that provides the value to

                                  test in the filter.

                                  If the name you specify isn''t defined in one

                                  or more of the events associated with the dashboard, the filter

                                  never matches anything. If the NOT property for this filter is set

                                  to true and the filter never matches, all event overlays are

                                  suppressed.'
                              value:
                                type: array
                                items:
                                  type: string
                                example:
                                - Paris
                                - London
                                description: 'An array of values to test against the specified property. If any of

                                  the values match, the system includes the event.

                                  Note: You must specify at least one element.'
                            title: DashboardEventSources
                          description: 'List of filters to apply to events for this event overlay, in the

                            form of a JSON array.'
                      description: 'Settings for an event overlay applied to each chart in a dashboard. You

                        specify the event overlays for a dashboard with two different

                        properties:


                        CreateDashboardBody.EventOverlays: Inactive event overlays that

                        you want to define for use at a later time.

                        CreateDashboardBody.selectedEventOverlays: Active event overlays

                        that you want to apply immediately to charts in the dashboard.'
                    title: DashboardSelectedEventOverlays
                    description: 'List of event overlays that are currently active for the charts in this

                      dashboard, in the form of a JSON array of JSON objects. For each

                      overlay, the system displays the active events that match the overlay

                      search term and optional feature, using the color and event line settings for the overlay.

                      To set options for inactive overlays so you can apply

                      them at a later time, use the eventOverlays property instead.'
                  tags:
                    type: array
                    items:
                      type: string
                    title: DashboardTags
                    description: not used
                  permissions:
                    title: Permission configuration for the dashboard
                    type: object
                    properties:
                      acl:
                        type: array
                        items:
                          title: An access control layer
                          type: object
                          properties:
                            actions:
                              type: array
                              items:
                                type: string
                                enum:
                                - READ
                                - WRITE
                              description: Action the user, team, or organization can take with the dashboard.
                            principalType:
                              type: string
                              enum:
                              - USER
                              - TEAM
                              - ORG
                              description: Clarify whether this permission configuration is for a user, a team, or an organization.
                            principalId:
                              type: string
                              description: ID of the user, team, or organization for which you're granting permissions.
                          description: A permission configuration for a user, team, or organization.
                        description: 'List of permission configurations.

                          Use this list to specify read and write permissions for your dashboard. The parent property is set
                          to null by default if you do this.

                          Use the parent property instead if you want your dashboard to inherit permissions from an existing
                          dashboard group.'
                      parent:
                        type: string
                        description: 'ID of the dashboard group you want your dashboard to inherit permissions from.

                          Use this property to configure your dashboard to inherit permissions from an existing dashboard
                          group.

                          Use the acl property instead if you want to specify various read and write permission configurations.'
                    description: Read and write permission configuration to specify which user, team, and organization can
                      view and/or edit your dashboard.
              examples:
                example:
                  value:
                    authorizedWriters:
                      teams:
                      - ZZZZ4
                      - Z2X
                      users:
                      - YXXX
                      - XYYY
                    chartDensity: DEFAULT
                    charts:
                    - chartId: XY1XX5
                      column: 5
                      height: 2
                      row: 10
                      width: 7
                    created: 1641024000000
                    creator: XXYYX
                    customProperties: string
                    description: Latency measurements
                    eventOverlays:
                    - eventColorIndex: 5
                      eventLine: true
                      eventSignal:
                        eventSearchText: ValueExceeded
                        eventType: detectorEvents
                      sources:
                      - NOT: false
                        property: datacenter
                        value:
                        - Paris
                        - London
                    filters:
                      sources:
                      - NOT: false
                        property: host
                        value:
                        - host5
                        - host6
                      time:
                        end: 1647943200000
                        start: 1647936000000
                      variables:
                      - alias: Europe
                        preferredSuggestions:
                        - Europe
                        - Asia
                        property: datacenter
                        required: true
                        restricted: true
                        value:
                        - London
                        - Paris
                    groupId: YYXXYY
                    id: ZZZXXXX
                    lastUpdated: 1647990000000
                    lastUpdatedBy: XXXX888
                    maxDelayOverride: 1000
                    name: Latency
                    permissions:
                      acl:
                      - actions:
                        - READ
                        principalId: string
                        principalType: USER
                      parent: string
                    selectedEventOverlays:
                    - eventSignal:
                        eventSearchText: ValueExceeded
                        eventType: detectorEvents
                      overlayId: E5
                      sources:
                      - NOT: false
                        property: datacenter
                        value:
                        - Paris
                        - London
                    tags:
                    - string
