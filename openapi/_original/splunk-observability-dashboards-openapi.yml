      security:
      - SessionToken: []
      tags:
      - Dashboards
    delete:
      summary: Delete Single Dashboard
      description: 'Deletes the dashboard that has the ID specified in the

        {id} path parameter. This API doesn''t use a request body.'
      parameters:
      - name: id
        in: path
        description: ID of an existing dashboard
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Format of the request body. Always  application/json.
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
