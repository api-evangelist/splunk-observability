                    description: 'Milliseconds to wait for late-arriving data points before rejecting them

                      for inclusion in the charts in this dashboard. This value overrides

                      but doesn''t change the max delay setting for individual charts in the

                      dashboard. If you omit this property, the system uses individual chart

