  /dashboard/simple:
    post:
      summary: Create Simple Dashboard
      description: 'Creates a dashboard containing the new and existing charts you specify

        in the request body.  For this dashboard, you can only specify the following values:


        Dashboard group: To add the new dashboard to an existing dashboard group, use the groupId query parameter.

        If you don''t provide groupId, the API creates a new dashboard group.

        Note: If you''re using the Enterprise Edition of Splunk Observability Cloud, the dashboardViews entitlement is

        enabled. In this case, the API returns an error instead of creating a dashboard.


        Dashboard name: To specify a name for the new dashboard, use the name query parameter.

        You must provide the name parameter or specify a new chart as the first entry in the list of

        charts in the request body (new charts always require the name field). If you don''t provide name,

        and the first chart in the list isn''t a new chart, the API returns an error.


        This endpoint doesn''t let you set the following dashboard-related fields:


        authorizedWriters: List of users and teams that can modify the dashboard

        chartDensity: Desired density of charts in this dashboard

        description: Extended description of the dashboard

        eventOverlays: List of all events you can display on charts in the dashboard

        filters: List of filters to apply to all charts in the dashboard. Filters include or exclude data points

        based on custom properties or dimensions.

        maxDelayOverride: For all charts in the dashboard, this overrides the maxDelay value for the chart

        selectedEventOverlays: List of all active event overlays for this dashboard

        permissions: Read and write control for this dashboard


        The request body for this operation is a list of chart objects you want to add to the new dashboard, in the

        form of a JSON array of JSON objects.'
      parameters:
      - name: name
        in: query
        description: 'Name to assign to the dashboard. If you don''t provide this parameter, the API

          gives the new dashboard the name of the first new chart in the list of charts in the

          request body.

          If you don''t provide name, and the first chart in the list is not a new chart,

          the API returns an error.'
        schema:
          type: string
      - name: groupId
        in: query
        description: 'ID of an existing group to which you want to add the dashboard. If you don''t

          provide this parameter, the API creates a new dashboard group to contain the new

          dashboard

          Note: If you''re using the Enterprise Edition of Splunk Observability Cloud, the dashboardViews entitlement is

          enabled. In this case, the API returns an error instead of creating a dashboard.'
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Format of the request body. Always  application/json.
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: Authentication token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                title: Chart object in simple dashboard request body
                type: object
                properties:
                  customProperties:
                    title: Custom properties
                    type: object
                    example:
                      usage: Latency tracking
                      department: IT
                    description: Custom properties for the chart, in the form of a JSON object
                  description:
                    title: Chart description
                    type: string
                    example: Latency tracking chart for use by IT department
                    description: 'Description of the chart. This value appears underneath the chart name

                      in the user interface.'
                  chartId:
                    title: ID of an existing chart
                    example: AA4FA
                    description: 'Splunk Observability Cloud-assigned ID of an existing chart. Use this field to add an existing
                      chart to a new

                      dashboard.

                      In chart objects for existing charts you want to add to the dashboard, you must specify a value for
                      the chartId field.

                      The API ignores all other values. If the API can''t find an existing chart with the specified ID, the
                      API returns an error.

                      If you''re adding a new chart, you don''t have to add chartId to the chart object. If you do, the API
                      ignores it.'
                  name:
                    title: Chart name (displayed)
                    type: string
                    example: LatencyChart
                    description: 'Displayed name of the chart in the dashboard. If you''re using the API to create a new chart
                      for the

                      new dashboard, you must specify a value for this field.'
                  options:
                    type: object
                    title: Properties of a chart
                    required:
                    - type
                    properties:
                      areaChartOptions:
                        title: Properties for area charts
                        type: object
                        properties:
                          showDataMarkers:
                            title: Controls the display of data markers
                            type: boolean
                            default: false
                            example: true
                            description: 'If the options.type property is TimeSeriesChart and the

                              options.defaultPlotType property is AreaChart, then the

                              showDataMarkers field determines if Splunk Observability Cloud shows data markers in

                              the chart; otherwise, the property is ignored.'
                      axes:
                        title: Axes options
                        type: array
                        items:
                          title: Options for chart axes
                          type: object
                          properties:
                            highWatermark:
                              type: number
                              format: float
                              example: 12500
                              description: 'A point on the Y axis at which the chart displays a horizontal line,

                                indicating the max Y value of interest. Points with a Y value that

                                exceeds the high water mark still appear.

                                Notes:


                                Splunk Observability Cloud only uses this value for time series charts.

                                Value must be less than or equal to options.axes.max and greater than

                                options.axes.lowWaterMark for the corresponding axis.'
                            highWatermarkLabel:
                              type: string
                              maxLength: 1000
                              example: Maximum expected value
                              description: 'A label that''s displayed beside the horizontal line indicating the

                                high water mark

                                Notes:


                                Splunk Observability Cloud only uses this value for time series charts.

                                If options.axes.highWaterMark isn''t specified, this label is ignored.'
                            label:
                              type: string
                              example: Latency in milliseconds
                              description: 'Label that''s displayed for the Y axis of the chart. It appears to

                                the left of axis values on the left axis and to the right of axis

                                values on the right axis.

                                Note: Splunk Observability Cloud only uses this value for time series charts.'
                            lowWatermark:
                              type: number
                              format: float
                              example: 500
                              description: 'A point on the Y axis at which the chart displays a horizontal line,

                                indicating the minimum Y value of interest. Points with a Y value

                                that is less than the low water mark still appear.

                                Notes:


                                Splunk Observability Cloud only uses this value for time series charts.

                                Value must be greater than or equal to options.axes.min and less than

                                options.axes.highWaterMark for the corresponding axis.'
                            lowWatermarkLabel:
                              type: string
                              maxLength: 1000
                              example: Minimum expected value
                              description: 'A label that''s displayed beside the horizontal line indicating the

                                low water mark.

                                Notes:


                                Splunk Observability Cloud only uses this value for time series charts.

                                If options.axes.lowWaterMark isn''t specified, this label is ignored.'
                            max:
                              type: number
                              format: float
                              example: 15000
                              description: 'Specifies the largest data value to display on the chart. Overrides

                                options.includeZero if the properties are set to incompatible

                                values.

                                Notes:


                                This value is only used if options.type is set to TimeSeriesChart.

                                The value must be greater than the value of options.axes.min for the same options.axes element.'
                            min:
                              type: number
                              format: float
                              example: 1000
                              description: 'Specifies the smallest data value to display on the chart. Overrides

                                options.includeZero if the properties are set to incompatible

                                values.

                                Notes:


                                This value is only used if options.type is set to TimeSeriesChart.

                                The value must be less than the value of options.axes.max for the same options.axes element.'
                        description: 'These options are only used for time series charts.

                          List of axis options for the left and right side of a time series

                          chart, in the form of an array of JSON objects. The first element

                          specifies options for the left side of the chart, and the second

                          element corresponds to the right side of the chart. Other elements

                          are ignored.'
                      axisPrecision:
                        title: 'Specifies the number of digits displayed for values plotted on the

                          chart

                          '
                        type: integer
                        minimum: 3
                        maximum: 10
                        default: 3
                        example: 5
                        description: 'Precision that  Splunk Observability Cloud uses to display values in the chart. Choose
                          a

                          value that is sensible for the data; that is, ensure that the

                          variations in the data are discernible using the specified

                          precision. For example, if the data values usually fluctuate between

                          100000 and 100010, using a precision of 3 would result in a value of

                          100000 for every data point. Setting the precision to 6 would

                          distinguish between 100001 and 100002.

                          Note: Splunk Observability Cloud only uses this value for time series charts.'
                      colorBy:
                        title: 'Specifies the mechanism by which color is applied to values in the

                          chart

                          '
                        type: string
                        enum:
                        - Range
                        - Scale
                        - Dimension
                        - Metric
                        example: Metric
                        description: 'Specifies how to apply a color scheme to the values in the chart. If

                          you want to apply color in a text chart, use HTML within the

                          markdown property. The values you can use depend on the type of

                          chart you specify in options.type:


                          Text: The property is ignored

                          Heatmap: The Range and Scale enumerated types are allowed; the default is

                          Range

                          List: The Dimension, Metric, and Scale enumerated types are allowed;

                          the default is Metric

                          SingleValue: The Dimension, Metric, and Scale enumerated types are allowed;

                          the default is Metric

                          TimeSeriesChart: The Dimension and Metric enumerated types are allowed;

                          the default is Dimension.'
                      colorRange:
                        title: Specifies color range options for coloring a heatmap chart
                        type: object
                        properties:
                          color:
                            title: Starting color for a heatmap chart color range
                            type: string
                            minLength: 7
                            description: 'The starting hex color value for data values in a heatmap chart.

                              The options.colorScale property controls how Splunk Observability Cloud creates

                              a range of colors to represent different data values;

                              options.colorRange.color is the starting point of the range,

                              and options.colorScale controls the number of different

                              colors.

                              For best results, set options.colorRange.color to

                              one of the 21 colors in the official Splunk Observability Cloud color palette.

                              Specify the value as a 6-character hexadecimal value preceded by

                              the "#" character, for example "#00b9ff" (light blue)'
                          max:
                            title: 'Maximum color value assigned to a data value in the heatmap

                              chart

                              '
                            type: string
                            minLength: 7
                            description: 'The color value associated with the largest incoming data value

                              in the heatmap

                              Specify the value as a 6-character

                              hexadecimal value preceded by the ''#'' character, for example

                              "#ea1849" (grass green)'
                          min:
                            title: 'Minimum color value assigned to a data value in the heatmap

                              chart

                              '
                            type: string
                            minLength: 7
                            description: 'The color value associated with the smallest incoming data value

                              in the heatmap

                              Specify the value as a 6-character

                              hexadecimal value preceded by the ''#'' character, for example

                              "#999999".'
                        description: 'Range of color values for a heatmap chart, including the lowest and

                          highest color to use, in the form of a JSON object. The

                          options.colorScale property controls how Splunk Observability Cloud sets each

                          intermediate chart color within the range.'
                      colorScale:
                        title: 'Specifies how to apply the range of specified color values to data

                          in a heatmap chart

                          '
                        type: object
                        properties:
                          inverted:
                            title: 'Determines if colors are applied in reverse order from the

                              default for the app

                              '
                            type: boolean
                            default: false
                            description: 'Determines how to use colors specified in options.colorRange.

                              If this property is set to true and options.colorBy is set

                              to Range, darker colors represent smaller data values. For

                              chart types other than Heatmap, setting this property to true

                              results in red representing lower values and green representing

                              higher ones (if the default color scheme is in use).

                              Available when the chart type specified in options.type is set

                              to Heatmap, SingleValue, or List'
                          thresholds:
                            title: Specifies data values that partition the data in the chart
                            type: array
                            items:
                              type: number
                              format: float
                            description: 'Specifies data values that map to color gradient values, in the

                              form of a JSON array. Sort the values from lowest to highest.

                              Data values that are outside the specified partitions don''t

                              appear in color, so set the first element to the lowest expected

                              data value. Similarly, set the last element to the highest

                              expected data value.

                              Note: Splunk Observability Cloud uses only the first

                              six elements in the array.'
                        description: 'Properties that specify the limits of the color ranges specified in

                          options.colorRange. These properties also control how to order the

                          colors in the color gradient. Settings you make in

                          options.colorScale2 override any settings you make here.'
                      colorScale2:
                        title: Secondary visualization properties
                        type: array
                        items:
                          title: Secondary visualization options
                          type: object
                          required:
                          - paletteIndex
                          properties:
                            gt:
                              title: 'Indicates the lower threshold of this range, not including the value

                                itself

                                '
                              type: number
                              format: float
                              description: 'The lower threshold of a color range, not including the specified

                                value itself.

                                Notes:


                                Available if the options.type property is set to List,

                                SingleValue, or Heatmap

                                The value must be less than the value of options.colorScale2.lt

                                or options.colorScale2.lte of the same element.

                                options.colorScale2.gt and options.colorScale2.gte are

                                mutually exclusive'
                            gte:
                              title: 'Indicates the lower threshold of this range, including the value

                                itself

                                '
                              type: number
                              format: float
                              description: 'The lower threshold of a color range, including the specified value

                                itself.

                                Notes:


                                Available if the options.type property is set to List,

                                SingleValue, or Heatmap

                                The value must be less than the value of options.colorScale2.lt

                                or options.colorScale2.lte of the same element.

                                options.colorScale2.gt and options.colorScale2.gte are

                                mutually exclusive'
                            lt:
                              title: 'Indicates the upper threshold of this range, not including the value

                                itself

                                '
                              type: number
                              format: float
                              description: 'The upper threshold of a color range, not including the specified

                                value itself.

                                Notes:


                                Available if the options.type property is set to List,

                                SingleValue, or Heatmap

                                The value must be less than the value of options.colorScale2.gt

                                or options.colorScale2.gte of the same element.

                                options.colorScale2.lt and options.colorScale2.lte are

                                mutually exclusive'
                            lte:
                              title: 'Indicates the upper threshold of this range,including the value

                                itself

                                '
                              type: number
                              format: float
                              description: 'The upper threshold of a color range, including the specified value

                                itself.

                                Notes:


                                Available if the options.type property is set to List,

                                SingleValue, or Heatmap

                                The value must be less than the value of options.colorScale2.gt

                                or options.colorScale2.gte of the same element.

                                options.colorScale2.lt and options.colorScale2.lte are

                                mutually exclusive'
                            paletteIndex:
                              title: Color to use for data points in the specified range
                              type: integer
                              minimum: 0
                              maximum: 21
                              description: 'Index of a color listed in table 5 Color palette in the section Chart color palettes.

                                The value is used to color points in the specified range.

                                Notes:


                                Use only when options.type property is List or SingleValue;

                                otherwise, the API returns an HTTP response code 400.

                                Depending on the settings users select for color blindness, they may see

                                the alternate colors listed in Table 6. Color vision deficiency alternatives

                                of the Charts API guide.'
                        description: 'List of secondary visualization color properties, in the form of a

                          JSON array. Each element contains a range of values and the color to

                          display for the range. The array covers the entire range displayed

                          in the secondary visualization or heatmap chart.

                          Splunk Observability Cloud automatically orders the array elements by the chart values.

                          The lowest value is the left border of the secondary visualization,

                          and the highest value is the right border.'
                      defaultPlotType:
                        title: Specifies the plot type to use for this chart
                        type: string
                        example: LineChart
                        enum:
                        - LineChart
                        - AreaChart
                        - ColumnChart
                        - Histogram
                        default: LineChart
                        description: 'Specifies the plot type to use for this chart:


                          LineChart: A plot with data points connected by a series of

                          straight lines.

                          AreaChart: Similar to a LineChart, but with the area between

                          the plot line and the x-axis filled with the line color.

                          Column: Shaded vertical bars with their bottom on the

                          x-axis and their top at the data points value. The bars aren''t connected.

                          Histogram: Colored rectangular bins, with the color

                          representing the number of data points for a value. Depending on

                          how you set up your histogram chart, a green bar can indicate a higher

                          number of data points for a particular value than a red bar.'
                      groupBy:
                        title: 'Custom properties that you want to group together

                          chart

                          '
                        type: array
                        items:
                          type: string
                        description: 'A list of custom property names to group together in a histogram

                          or table chart, in the form of a JSON array of strings. Each array element

                          must contain the name of a property in the customProperties''

                          property in the request body or a valid default custom property.

                          The first array element is a custom property that determines the

                          top-level grouping. The second element determines the grouping

                          within each first-level grouping. All other elements in the array

                          are ignored.

                          For example, Heatmap chart grouping

                          shows a heatmap that groups CPU utilization by AWS availability zone as the primary grouping and
                          number of host

                          CPU cores as the secondary grouping.

                          Note: This option is only available if options.type is HeatMap or TableChart.'
                      groupBySort:
                        title: 'Table chart options

                          '
                        type: string
                        enum:
                        - Ascending
                        - Descending
                        description: 'Sorts a specified group of values in a table chart.

                          Groups can either be sorted by Ascending or Descending order.

                          Note: Use only when options.type property is TableChart; otherwise, the API returns an HTTP response
                          code 400.'
                      hideMissingValues:
                        title: 'Table chart options

                          '
                        type: boolean
                        default: false
                        description: 'Determines whether to include missing metric values in a table chart or list chart.

                          If true, MTS with missing values are excluded from the chart.

                          Note: Use only when options.type property is List or TableChart; otherwise, the API returns an HTTP
                          response code 400.'
                      histogramChartOptions:
                        type: object
                        properties:
                          colorThemeIndex:
                            title: Color to use for data points in a histogram chart
                            type: integer
                            minimum: 0
                            maximum: 15
                            default: 15
                            description: 'Color palette index that points to the theme color of a histogram chart. Use one
                              of the first 16 index values in

                              table 5 in the section Chart color palettes.

                              Notes:


                              Use only when options.type is TimeSeriesChart and options.defaultPlotType is Histogram;

                              otherwise, the API returns an HTTP response code 400.

                              Your users may see colors other than those shown in

                              table 5 in the section Chart color palettes,

                              depending on the settings they select for color blindness. To learn more, see

                              table 6 in the section Chart color palettes

                              of the Charts API guide.'
                      includeZero:
                        title: Determines how 0 affects Y-axis values
                        type: boolean
                        default: false
                        example: false
                        description: 'Flag that determines how 0 is treated when dynamically calculating

                          Y-axis values. If true, 0 is included in the calculation;

                          otherwise, Splunk Observability Cloud ignores data points containing 0. This is a

                          chart-wide setting applied to all the axes. However, if

                          options.axes.min or options.axes.max exclude 0 from the

                          displayed range for an axis, 0 isn''t displayed on that axis even if

                          includeZero is true.

                          Note: Only available if the options.type is TimeSeriesChart'
                      legendOptions:
                        title: Sets table options
                        type: object
                        properties:
                          fields:
                            title: List of table settings for properties in the chart
                            type: array
                            items:
                              type: object
                              properties:
                                enabled:
                                  title: Determines property display
                                  type: boolean
                                  default: true
                                  description: 'Determines if the property specified by

                                    legendOptions.properties.property for this element is

                                    displayed in the data table.

                                    Note: Only available if options.type is TimeSeriesChart, TableChart, or List'
                                property:
                                  title: Key name of a property specified for this chart
                                  type: string
                                  description: 'The key name of a property to hide or show in the data

                                    table'
                            description: 'List of table settings for properties in the chart, in the

                              form of a JSON array. Each element in the array is a JSON object

                              that contains a property name and a flag. If the flag for the

                              object is set to true, the property is displayed; otherwise,

                              it''s hidden.'
                        description: 'Sets options for the data table or table chart, including which properties are

                          omitted'
                      lineChartOptions:
                        type: object
                        title: Options for a line chart
                        properties:
                          showDataMarkers:
                            title: Determines how to represent data points in the chart
                            type: boolean
                            default: false
                            example: true
                            description: 'Flag that determines how to represent individual data points in

                              the chart. If true, the chart is displayed with filled circles

                              for each data points; otherwise, the chart is displayed as a

                              smooth line.'
                        description: 'Line chart options for a chart, in the form of a JSON object

                          Notes:


                          Only available if options.type is TimeSeriesChart

                          Only available if options.defaultPlotType is LineChart'
                      markdown:
                        title: Text chart contents
                        type: string
                        description: 'The contents of a text chart, using GitHub-Flavored Markdown

                          (GFM) or HTML.

                          Note: Only available if options.type is set to Text'
                      maximumPrecision:
                        title: Precision used used to display data
                        type: integer
                        description: 'Number of significant digits to the right of the decimal point to

                          use for data points in the chart. The integer part of the data points is

                          used, regardless of the specified precision. Choose a value so that

                          variations in the data are visible for the specified precision. For

                          example, if data values are in the range 0.001 to 0.01, set

                          maximumPrecision to 4. If you don''t specify a value, Splunk Observability Cloud

                          adjusts the precision to fit the available display area.

                          Note: Only available if options.type is List, TableChart, or SingleValue'
                      onChartLegendOptions:
                        type: object
                        title: Display options for the chart legend
                        properties:
                          dimensionInLegend:
                            title: The dimension to show in the legend
                            type: string
                            example: datacenter
                            description: 'Specifies the dimension to show in the legend. Ensure that the

                              dimension exists and has different values for each set of

                              data points in the chart.

                              Note: Only available if options.type is TimeSeriesChart'
                          showLegend:
                            title: Determines if a legend show display with the chart
                            type: boolean
                            default: false
                            example: true
                            description: 'Flag that determines if Splunk Observability Cloud should display a legend with

                              the chart. If true, a legend is displayed below the chart.

                              This legend lists the each value of the dimension specified in

                              the options.onChartLegendsOptions.dimensionInLegend property.

                              Next to each value is the color of the data point that has that

                              dimension value in the chart.

                              Note: Only available if options.type is `TimeSeriesChart'''
                        description: 'Properties that determine if a legend should be displayed, and if so

                          which dimension to show in the legend.

                          Note: Only available if the options.type property is set to

                          TimeSeriesChart'
                      programOptions:
                        title: General options for the chart
                        type: object
                        properties:
                          disableSampling:
                            title: Determines if the chart uses sampling
                            type: boolean
                            default: false
                            example: false
                            description: 'Determines if the chart displays samples from the data or plots

                              every data points. By default, Splunk Observability Cloud uses sampling to provide

                              better performance for charts.

                              Note: Available for all values of options.type except

                              for Text'
                          maxDelay:
                            title: Interval to wait before charting the available data
                            type: integer
                            format: int32
                            minimum: 0
                            maximum: 900000
                            example: 10000
                            description: 'Time in milliseconds to wait before charting the available data

                              and ignoring points that arrive afterwards. By default, Splunk Observability Cloud

                              automatically detects and applies a sensible value. You can also

                              choose the automatic option by explicitly setting maxDelay to

                              0. The maximum value is 900,000 ms (15 minutes).

                              Note: Available for all values of options.type except Text'
                          minimumResolution:
                            title: The minimum data resolution to use
                            type: integer
                            minimum: 0
                            maximum: 900000
                            example: 10000
                            description: 'The minimum resolution to use when computing the SignalFlow

                              program, specified in milliseconds. By default, Splunk Observability Cloud

                              computes and applies a sensible value. You can also choose the

                              automatic option by explicitly setting minimumResolution to 0.

                              The maximum value is 900,000 ms (15 minutes).

                              Note: Available for all values of options.type except

                              for Text'
                        description: 'A set of options that control the general appearance and operation

                          of the chart

                          Note: Available for all values of options.type except for Text'
                      publishLabelOptions:
                        title: General options for a specific SignalFlow statement for the chart
                        type: array
                        items:
                          type: object
                          title: General chart options for the SignalFlow in the chart
                          properties:
                            displayName:
                              title: Alternate display name
                              type: string
                              example: PlotName
                              description: 'Specifies an alternate value for the Plot Name column of the data

                                table associated with the chart.

                                Note: Only available if options.type is TimeSeriesChart,

                                List, or SingleValue'
                            label:
                              title: 'The SignalFlow `publish()` function label to which the properties of

                                this object apply

                                '
                              type: string
                              example: Latency
                              description: 'A label in a SignalFlow publish() function that gets associated

                                with the other properties of this SignalFlow options object.

                                Note: Only available if options.type is TimeSeriesChart,

                                List, SingleValue, or Heatmap'
                            paletteIndex:
                              title: Color to use for plots associated with this SignalFlow statement
                              type: integer
                              minimum: 0
                              maximum: 15
                              description: 'Color to use for this plot, in the form of an integer index into the color table
                                displayed in

                                table 5 in the section Chart color palettes.

                                Only the first 16 entries (0-15) are allowed for this value.

                                This property corresponds to the Plot Color palette selector that appears in the

                                Visualization Options pane. To select this pane, click the Configure plot

                                icon on the right-hand side of the Plot Editor options bar.

                                Notes:


                                NOT available when options.type is Heatmap or Text. For these

                                types, the API returns an HTTP response code 400.

                                When options.type is SingleValue or List, or when options.type is TimeSeriesChart

                                and options.publishLabelOptions.plotType is Histogram, paletteIndex is valid but has no effect
                                on the plot color.

                                Users may see colors other than those shown in the table, depending on the settings they select
                                for color

                                blindness. To see sample swatches of the alternate colors and the mappings used for

                                color-blind users, see the hexadecimal color codes for the first 16 entries in

                                table 6 in the section Chart color palettes.'
                            plotType:
                              title: 'Override of `options.defaultPlotType` for the output of the

                                SignalFlow statement

                                '
                              type: string
                              example: LineChart
                              enum:
                              - LineChart
                              - AreaChart
                              - ColumnChart
                              - Histogram
                              description: 'Enumerated types that you can use to override the value of

                                options.defaultPlotType for the output of the SignalFlow statement

                                referred to by options.publishLabelOptions.label.

                                Note: Only available if options.type is TimeSeriesChart, List, or SingleValue.'
                            valuePrefix:
                              title: String to prepend to values displayed in charts
                              type: string
                              example: Latency in
                              description: 'Specifies a string to prepend to values displayed in a single value

                                or list chart, the data table for a chart, and the tooltip shown

                                when you hover over a point on a chart. To learn more, see the

                                example in the section [Single value charts]

                                (https://dev.splunk.com/observability/docs/chartsdashboards/charts_overview#Single-value-charts).

                                Splunk Observability Cloud overrides valuePrefix if

                                options.publishLabelOptions.valueUnit is set for the same

                                plot.

                                Note: Only available if options.type is

                                TimeSeriesChart, List, SingleValue, or Heatmap'
                            valueSuffix:
                              title: String to append to values displayed in charts
                              type: string
                              example: milliseconds
                              description: 'Specifies a string to append to values displayed in a single value

                                or list chart, the data table for a chart, and the tooltip shown

                                when you hover over a point on a chart. To learn more, see the

                                example in the section [Single value charts]

                                (https://dev.splunk.com/observability/docs/chartsdashboards/charts_overview#Single-value-charts).

                                Splunk Observability Cloud overrides valueSuffix if

                                options.publishLabelOptions.valueUnit is set for the same

                                plot.

                                Note: Only available if options.type is

                                TimeSeriesChart, List, SingleValue, or Heatmap'
                            valueUnit:
                              title: Specifies the display units to use for chart values
                              type: string
                              example: Millisecond
                              enum:
                              - Bit
                              - Kilobit
                              - Megabit
                              - Gigabit
                              - Terabit
                              - Petabit
                              - Exabit
                              - Zettabit
                              - Yottabit
                              - Byte
                              - Kibibyte
                              - Mebibyte
                              - Gibibyte
                              - Tebibyte
                              - Pebibyte
                              - Exbibyte
                              - Zebibyte
                              - Yobibyte
                              - Nanosecond
                              - Microsecond
                              - Millisecond
                              - Second
                              - Minute
                              - Hour
                              - Day
                              - Week
                              description: 'Specifies the units of measure for values displayed in the chart.

                                Splunk Observability Cloud displays chart values based on the assumption that the raw

                                data is unit of measure you select. For example, the value 1000 in a

                                plot where options.publishLabelOption.valueUnit is set to bits

                                is displayed as 1 Kilobit, and the value 1024 in a plot set to

                                Bytes is presented as 1 Kebibyte.

                                For a full specification, refer to the section

                                Display units and other labels ,

                                The options.publishLabelOptions.valueUnit option applies to scaling

                                and labeling in chart tooltips, axes, and data tables. If

                                options.publishLabelOptions.valueUnit affects the chart

                                presentation, it overrides options.publishLabelOptions.valuePrefix,

                                options.publishLabelOptions.valueSuffix, and options.unitPrefix.

                                Note: Available for all values of options.type except for Text.'
                            yAxis:
                              title: Specifies the position of the Y axis
                              type: integer
                              default: 0
                              minimum: 0
                              maximum: 1
                              example: 0
                              description: 'Specifies the position of the Y-axis for the plot associated with

                                the SignalFlow statement. If yAxis is set to 0, the axis is on the

                                left side; otherwise it''s on the right. The default is 0 (left

                                side).

                                Note: This option is only available if ''options.typeisTimeSeriesChart, List, or SingleValue`.'
                          required:
                          - label
                          description: Plot options
                        description: 'List of properties that specify general options for the

                          SignalFlow program in the chart, in the form of a JSON array. The order of

                          elements in the list is retained, but has no effect. Splunk Observability Cloud uses

                          label values to map options to specific publish() statements in

                          the SignalFlow program. Heatmaps do not support full

                          publishLabelOptions elements; the description of each property

                          shows its supported chart types.

                          Note: Available if options.type is one of TimeSeriesChart,

                          List, SingleValue, or Heatmap'
                      refreshInterval:
                        title: Interval at which Splunk Observability Cloud should update the chart with new data
                        type: integer
                        minimum: 0
                        description: 'How often, in milliseconds, Splunk Observability Cloud refreshes the chart with data.

                          If Splunk Observability Cloud can detect the resolution of the data, the default is

                          10,000 (10 seconds); otherwise, the default is 3,600,000 (1

                          hour).

                          Note: This option is only available if options.type

                          is List, TableChart, or SingleValue.'
                      secondaryVisualization:
                        title: Specifies the secondary visualization to use with the chart
                        type: string
                        enum:
                        - None
                        - Radial
                        - Linear
                        - Sparkline
                        description: 'Specifies the secondary visualization to use with list or

                          single value charts:


                          For list charts, see List chart secondary visualization

                          For single value charts, see Single value chart secondary visualization


                          Note: This option is only available if option.type is List

                          or SingleValue.'
                      showEventLines:
                        title: Specifies what to show on a chart when an event occurs
                        type: boolean
                        default: false
                        example: true
                        description: 'If true, Splunk Observability Cloud displays a vertical line on the chart at the

                          point that an event occurs.

                          Note: This option is only available if options.type is

                          TimeSeriesChart.'
                      showSparkLine:
                        title: 'Determines if Splunk Observability Cloud should show a sparkline in a single value

                          chart

                          '
                        type: boolean
                        default: false
                        description: 'If true, Splunk Observability Cloud displays a sparkline for the value shown in a

                          SingleValue chart.

                          Notes:


                          This option is only available if "options.type": "SingleValue".

                          The value specified for options.secondaryVisualization overrides options.showSparkLine.'
                      sortBy:
                        title: Specifies how to sort the entries in a chart
                        type: string
                        description: 'Specifies how to sort the entries in a list or table chart. The first

                          character of the value must be either:


                          A minus sign (-) sets descending order for the data.

                          A plus sign (+) sets ascending order for the data.


                          The rest of the value specifies the sort criteria:


                          A keyword that represents a data point value, a metric, or the

                          publish() label of the SignalFlow statement that generates the data

                          A dimension that''s available to the chart.


                          The default is to sort on the publish() label in ascending order;

                          this corresponds to the Auto option in the user interface.

                          Values that don''t map to a keyword or valid dimension are sorted

                          with the default specification.

                          Data that contains null sorts to the start of the list for ascending

                          order and to the end of the list for descending order.

                          Note: This option is only available if option.type is List or TableChart.'
                      sortDirection:
                        title: Specifies how to sort values in a heatmap chart
                        type: string
                        enum:
                        - Ascending
                        - Descending
                        default: Ascending
                        description: 'If set to Ascending, the chart displays values from low to high;

                          otherwise, the chart displays values from high to low.

                          Note: This option is only available if options.type is HeatMap.'
                      sortProperty:
                        title: A custom property to use as the sort criteria for a heatmap chart
                        type: string
                        description: 'The custom property to use as the sorting criteria for the heatmap

                          chart. The value should map to a valid key name specified in the

                          customProperties property or to a valid custom property available by

                          default. If no value is specified, the values are displayed without

                          an obvious order. The name of a custom property to use as the sort

                          criteria for a heatmap chart. The value must be a valid key

                          specified by the customProperty property or a valid default custom

                          property. If you don''t specify a value, the chart displays the

                          values without any obvious order.

                          Note: This option is only available if options.type is HeatMap.'
                      stacked:
                        title: Controls the display of stacked plots in a time series chart
                        type: boolean
                        default: false
                        description: 'Controls the display of stacked plots in a time series chart. If

                          true, Splunk Observability Cloud stacks charts and adds data points together to

                          create the values indicated by the axis labels. You can still see

                          individual values when you highlight them within the colored area

                          representing a single plot. You can also view individual values in

                          the data table.

                          Note: This option is only available if options.type is

                          TimeSeriesChart and options.defaultPlotType is AreaChart

                          or ColumnChart.'
                      time:
                        title: Options for the time displayed in a chart
                        type: object
                        properties:
                          end:
                            title: Timestamp of the last time to display in the chart
                            type: integer
                            format: int64
                            minimum: 0
                            example: 1557707430000
                            description: 'The timestamp of the last time to display in the chart, in *nix

                              time

                              Note: This option is only available if options.type is

                              TimeSeriesChart and options.time.type is absolute.'
                          range:
                            title: Number of milliseconds to display in the chart
                            type: integer
                            format: int64
                            minimum: 0
                            default: 0
                            description: 'The number of milliseconds to display in the chart. From this

                              value, Splunk Observability Cloud calculates a rolling range with the current time

                              at the right edge of the chart. Use 0 to use the default

                              behavior, which is -15m except for the following metrics:


                              AWS: See the metrics listed in the Connect to AWS topic in the user documentation.

                              GCP: See the metrics listed in the Connect to GCP topic

                              in the user documentation.

                              Microsoft Azure: See the metrics listed in the Connect to Azure topic

                              in the user documentation.


                              Note: This option is only available if options.type is

                              TimeSeriesChart and options.time.type is relative.'
                          start:
                            title: Timestamp of the first time to display in the chart
                            type: integer
                            format: int64
                            minimum: 0
                            example: 1557534630000
                            description: 'The timestamp of the first time to display in the chart, in *nix

                              time

                              Note: This option is only available if options.type is

                              TimeSeriesChart and options.time.type is absolute.'
                          type:
                            title: Determines the type of time range to use
                            type: string
                            enum:
                            - relative
                            - absolute
                            default: relative
                            example: relative
                            description: 'Determines whether to use an explicit time range or to show a

                              range of the last n milliseconds.

                              Note: This option is only available if options.type is

                              TimeSeriesChart.'
                        description: 'Time-related properties for a chart.

                          Note: These properties are only available if options.type is

                          TimeSeriesChart.'
                      timeStampHidden:
                        title: Determines if the timestamp is shown with displayed values
                        type: boolean
                        default: false
                        example: true
                        description: 'Determines if the timestamp displays with displayed values. If

                          true, the timestamp for a value appears with the value in the

                          chart.

                          Note: This option is only available if options.type

                          is Heatmap, TableChart, or SingleValue.'
                      type:
                        title: The type of chart or visualization to use for the data
                        type: string
                        enum:
                        - Heatmap
                        - List
                        - SingleValue
                        - TableChart
                        - Text
                        - TimeSeries
                        example: TimeSeries
                        description: 'The type of chart or visualization to use for the data:


                          Heatmap: Displays values in an ordered set of colored boxes.

                          The color indicates the relative health of the value.


                          List: Display each value in its own row within a plot that

                          shows recent changes


                          SingleValue: Displays a single value with a color that

                          indicates the health of the value.


                          TableChart: Displays metrics and dimensions in table format.


                          Text: Displays pre-defined text, optionally formatted with

                          Markdown markup


                          TimeSeries: Displays multiple data points, retaining

                          historical data, in one of four modes:


                          Line: Displays data points as chart points connected by

                          straight lines. Each set of chart points and lines has its

                          own specific color.

                          Area: Similar to a Line chart, but the area between a line and the

                          X-axis is filled with the line color.

                          BarChart: Displays each data point as a colored vertical

                          bar. The base of the bar is the X-axis, and its top is the

                          data points value. data points are closely packed around the

                          X-axis time value associated with the data point.

                          Also known as a column chart.


                          You can optionally display data points in a stacked bar

                          chart. In this type of chart, different data points are

                          vertical bars stacked above their associated time. Colors

                          help differentiate the data points.'
                      unitPrefix:
                        title: Determines whether to use metric or binary units for chart values
                        type: string
                        enum:
                        - Metric
                        - Binary
                        default: Metric
                        example: Metric
                        description: 'Specifies the type of unit to use when displaying or labeling values:


                          Metric: Values represent decimal multiples. For example, if

                          unitPrefix is Metric, 1K represents 1 kilobyte or 1000 bytes.

                          Binary: Values represent binary multiples. For example, if

                          unitPrefix is Binary, 1K represents 1 kibibyte or 1024 bytes.


                          Note: This option is available for all values of option.type

                          except Text'
                  packageSpecifications:
                    title: SignalFlow internal field
                    type: string
                    description: For internal use only.
                  programText:
                    title: Chart SignalFlow program
                    type: string
                    example: data('demo.latency.interval').publish(label='Latency')
                    description: 'A SignalFlow program that computes data for the chart. If you''re adding a new chart to
                      the new dashboard,

                      you must specify this field; otherwise, the API ignores the value.

                      If you use more than one line of SignalFlow, separate the lines with semicolons (";") or

                      newline characters ("\n"). See Charts and SignalFlow

                      for more information.'
                  tags:
                    title: Chart tags
                    type: array
                    items:
                      type: string
                      format: UTF-8
                      maxLength: 256
                      maxItems: 50
                      description: 'UTF-8 string, starting with an uppercase or lowercase alphabetic

                        character. The maximum length is expressed in characters; if a string

                        consists solely of single-byte UTF-8 entities, 1024 characters are

                        available.'
                    description: 'List of chart tags, in the form of a JSON array of strings. Use tags to

                      search for or filter charts. One use is to tag charts that are in

                      production with the value prod.

                      Note: You can''t have more

                      than 50 tags per chart.'
                description: 'For a chart you want to add to a new simple dashboard, this JSON object contains the fields
                  for the chart.

                  If the chart doesn''t exist, the API uses the fields in the object to create a new chart. The only required

                  fields are name and programText.

                  If the chart exists, the only required field is chartId. If you specify other fields, the API ignores their

                  values. If you specify a chart ID that doesn''t exist, the API returns an error.

                  If you don''t specify a dashboard name in the name query parameter, the API takes the dashboard name from
                  the

                  chart name of the first new chart in the request body. If you don''t specify a dashboard name in the query

                  parameter, and you don''t try to create any new charts, the API returns an error.'
            examples:
