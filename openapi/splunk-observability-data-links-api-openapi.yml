    delete:
      description: 'Deletes the data link specified by the {id} path parameter. This

        method doesn''t use a request body. It returns ''204'' if the method

        succeeds.'
      parameters:
      - name: id
        in: path
        description: ID of an existing data link
        required: true
        schema:
          type: string
      - name: X-SF-TOKEN
        in: header
        description: 'Authentication token. Must be a session token (User API access

          token) associated with an administrator.'
        required: true
        schema:
          type: string
      responses:
        '204':
          description: HTTP 204 response
        '404':
          description: HTTP 404 response
          content:
