          application/json:
            schema:
              type: object
              properties:
                test:
                  type: object
                  title: SslTestRequest
                  required:
                  - name
                  - active
                  - frequency
                  - schedulingStrategy
                  - locationIds
                  - host
                  properties:
                    name:
                      type: string
                      example: My SSL Cert Test
                      title: TestName
                    active:
                      type: boolean
                      example: true
                      title: Active
                    frequency:
                      type: integer
                      format: int32
                      example: 5
                      maximum: 1440
                      minimum: 1
                      title: Frequency
                      description: How often to run your test.
                    schedulingStrategy:
                      type: string
                      example: round_robin
                      enum:
                      - round_robin
                      - concurrent
                      title: SchedulingStrategy
                      description: 'Type of scheduling strategy. This can only be:


                        round_robin

                        concurrent'
                    locationIds:
                      type: array
                      items:
                        type: string
                      example:
                      - aws-us-east-1
                      title: LocationIds
                      description: An array of location IDs where the test runs.
                    host:
                      type: string
                      example: example.com
                      title: Host
                      description: The host to test.
                    port:
                      type: integer
                      format: int32
                      example: 443
                      default: 443
                      minimum: 1
                      maximum: 65535
                      title: Port
                      description: The port to test.
                    serverName:
                      type: string
                      example: example.com
                      title: ServerName
                      description: The server name definition of SNI (Server Name Indication) support allows a single server
                        to host multiple TLS/SSL certificates on the same IP address and port.
                    allowUntrustedRoot:
                      type: boolean
                      example: true
                      title: AllowUntrustedRoot
                      description: Allow untrusted root certificate in chain. true will disable untrusted root certificate
                        validation.
                    allowSelfSigned:
                      type: boolean
                      example: true
                      title: AllowSelfSigned
                      description: Allow self-signed certificate in chain. true will disable self-signed certificate validation.
