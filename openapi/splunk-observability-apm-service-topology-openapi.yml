                      title: Service
                      description: 'Properties of an individual service in the

                        topology or dependency list'
                    title: Services
                    description: 'List of outbound and inbound services, in the form of a

                      JSON array of JSON objects'
              examples:
                example:
                  value:
                    inbound:
                    - inbound_service
                    outbound:
                    - outbound_service
                    services:
