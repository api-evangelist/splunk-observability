  /clients/metadata/values:
    get:
      summary: listClientMetadataValues
      description: 'Retrieve the distinct, non-empty values that clients in the caller''s tenant report for a single metadata
        key. Values are returned in ascending lexicographic order and paginated with the same limit/offset shape as GET /clients.

        The total_count in the pagination envelope is the total number of distinct values, not the number of clients.

        Empty values and clients where the key is absent are excluded. Dead clients (outside the liveness window) are excluded.

        The filter= and healthy= parameters narrow which clients are considered before the distinct values are computed. They
        accept the same grammar as GET /clients.'
      parameters:
      - name: key
        in: query
        description: Metadata key whose distinct values to return (e.g. env, host.name, k8s.io/name). Passing the key as a
          query parameter (rather than a path segment) allows slash-delimited keys to be expressed without percent-encoding
          path separators.
        required: true
        schema:
          minLength: 1
          type: string
      - name: limit
        in: query
        description: 'Size of page (number of values to return). The server enforces a configurable maximum (default: 1000).'
        schema:
          default: 100
          minimum: 1
          type: integer
      - name: offset
        in: query
        description: Offset for pagination (number of values to skip).
        schema:
          default: 0
          minimum: 0
          type: integer
      - name: healthy
        in: query
        description: Restrict which clients are considered. Same semantics as GET /clients. Repeat to match any selected health
          state. At most 10 healthy values are accepted per request.
        schema:
          items:
            enum:
            - 'true'
            - 'false'
            - unknown
            type: string
          maxItems: 10
          type: array
      - name: connection_health
        in: query
        description: Restrict which clients are considered by derived connection health. Same semantics as GET /clients. Repeat
          to match any selected connection state.
        schema:
          items:
            enum:
            - active
            - inactive
            type: string
          maxItems: 10
          type: array
      - name: filter
        in: query
        description: Filter by client metadata attribute. Repeat to apply multiple filters. Same grammar as GET /clients.
        schema:
          items:
            pattern: ^[^:]+:.*$
            type: string
          maxItems: 10
          type: array
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                properties:
                  pagination:
                    properties:
                      has_next:
                        example: true
                        type: boolean
                        description: Whether there are more items available
                      limit:
                        example: 100
                        type: integer
                        description: Number of items requested per page
                      next_offset:
                        example: 100
                        type: integer
                        description: Offset value for the next page (only present if has_next is true)
                      offset:
                        example: 0
                        type: integer
                        description: Number of items skipped
                      total_count:
                        example: 42573
                        type: integer
                        description: Total number of items matching the query
                    required:
                    - limit
                    - offset
                    - total_count
                    type: object
                    title: PaginationMetadata
                  values:
                    items:
                      type: string
                    type: array
                    description: Distinct, non-empty values for the requested metadata key, sorted ascending.
                required:
                - values
                - pagination
                type: object
                title: MetadataValuesResponse
              examples:
                example:
                  value:
                    pagination:
                      has_next: true
                      limit: 100
                      next_offset: 100
                      offset: 0
                      total_count: 42573
                    values:
                    - string
        '400':
          description: HTTP 400 response
          content:
            application/json:
              schema:
                example:
                  error:
                    code: BAD_REQUEST
                    details: {}
                    message: Bad Request
                properties:
