deprecated_operations_note: >-
  No operation in any of the 48 OpenAPI documents carries deprecated: true. Splunk does version
  side by side instead — Synthetics ships both V1 and V2 documents for API tests and browser tests,
  and Retrieve Events ships V1 and V2, with neither generation marked deprecated in the contract.
status_page: https://status.signalfx.com
status_page_note: >-
  https://status.signalfx.com is the Splunk Observability Cloud status index; each realm has its own
  Statuspage instance (for example https://status.us0.signalfx.com, titled "Splunk Observability
  Cloud US0 Status"). This is a DIFFERENT status page from https://status.splunkcloud.com, which is
  Splunk Cloud Platform and carries no Observability components.
