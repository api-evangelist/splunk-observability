deprecation:
  policy_url: https://help.splunk.com/en/splunk-observability-cloud/administer/org-reference-info/view-your-realm-api-endpoints-and-organization
  sunset_header: false
  deprecation_header: false
  formal_policy: false
  note: >-
    Splunk publishes no formal API deprecation policy, no sunset timetable and no RFC 8594
    Sunset/Deprecation headers for Splunk Observability Cloud. What it does publish is a concrete
    domain migration: as of 2026-03-24 both the legacy signalfx.com endpoints and the new
    observability.splunkcloud.com endpoints are valid, and Splunk names both forms explicitly
    (ingest.<REALM>.signalfx.com alongside ingest.<REALM>.observability.splunkcloud.com). No
    removal date for the legacy domain has been announced. This repo's specs carry the new domain
    except audit_events, whose own servers[] block still names https://api.us0.signalfx.com.
  library_deprecations:
    - The SignalFx-era client libraries (signalfx on PyPI/npm, com.signalfx.public on Maven) are
      deprecated; the repositories state final versions were published on or before 2025-03-01.
    - signalfx/signalflow-cli is archived (last push 2021-12-20).
