note: >-
  Splunk's OpenAPI operations carry human-sentence operationId values ("Retrieve Incidents",
  "Retrieve Metadata MetricsQuery") rather than camelCase identifiers; the crosswalk quotes those
  strings exactly as the specs carry them. Confidence is set from semantics, not from an observed
  schema, because the live MCP schema is auth-gated.
crosswalk:
  - tool: get_metric_names
    category: metrics
    rest: ['Retrieve Metadata MetricsQuery']
    spec: openapi/splunk-observability-metrics-metadata-openapi.yml
    binding: rest
    confidence: high
    note: GET /metric takes a metric-name query and returns matching metric metadata.
  - tool: get_metric_metadata
    category: metrics
    rest: ['Retrieve Metadata Metric Name', 'Retrieve Dimensions Query', 'Retrieve Metric Timeseries Metadata']
    spec: openapi/splunk-observability-metrics-metadata-openapi.yml
    binding: rest
    confidence: medium
    note: >-
      Fans out. "dimensions, properties, and sample values" spans GET /metric/{name},
      GET /dimension and GET /metrictimeseries; the tool composes them server-side.
  - tool: execute_signalflow_program
    category: signalflow
    rest: ['Execute SignalFlow computation']
    spec: openapi/splunk-observability-signalflow-openapi.yml
    binding: rest
    confidence: high
    note: POST /v2/signalflow/execute — the same operation the rate-limits artifact records a job-start limit on.
  - tool: get_apm_service_dependencies
    category: apm
    rest: ['Retrieve Dependencies by Service Name', 'Retrieve service topology']
    spec: openapi/splunk-observability-apm-service-topology-openapi.yml
    binding: rest
    confidence: high
  - tool: get_apm_trace_tool
    category: apm
    rest: ['getTraceSegmentTimestamps', 'getSegment', 'getLatestSegment']
    spec: openapi/splunk-observability-trace-id-openapi.yml
    binding: rest
    confidence: high
    note: Trace detail requires listing segment timestamps then fetching a segment; the tool composes both.
  - tool: search_alerts_or_incidents
    category: alerting
    rest: ['Retrieve Incidents', 'Retrieve Incident ID', 'Retrieve Events Using Query', 'Retrieve Incidents Single Detector']
    spec: openapi/splunk-observability-incidents-openapi.yml
    binding: rest
    confidence: medium
    note: >-
      "alerts or incidents" is broader than any single operation — GET /incident covers incidents,
      GET /event/find and GET /detector/{id}/incidents cover detector-generated alerts.
  - tool: get_apm_services
    category: apm
    rest: ['Retrieve service topology']
    spec: openapi/splunk-observability-apm-service-topology-openapi.yml
    binding: rest
    confidence: low
    note: >-
      POST /apm/topology returns the service graph, from which a service list is derivable, but
      Splunk publishes no dedicated list-services operation. Mapped by semantics only.
mcp_only:
