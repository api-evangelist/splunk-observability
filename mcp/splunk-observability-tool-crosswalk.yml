    reason: >-
      Natural-language-to-SignalFlow generation is a model capability of the AI Assistant. No REST
      operation in any of the 48 specs generates a program; POST /v2/signalflow/execute only runs
      one you already have.
  - tool: get_apm_environments
    reason: >-
      No published REST operation lists APM environments. The environment appears as a filter on
      other APM surfaces, not as its own resource.
  - tool: get_apm_service_latency
    reason: >-
      Latency-breakdown-by-tag is a server-side aggregation. The published REST surface exposes it
      only indirectly, through SignalFlow programs against APM MetricSets.
  - tool: get_apm_service_errors_and_requests
    reason: Same as get_apm_service_latency — an aggregation with no dedicated REST operation.
  - tool: get_apm_exemplar_traces
    reason: >-
      Exemplar/sample trace selection has no REST operation; the trace_id API retrieves a trace you
      already have an ID for.
