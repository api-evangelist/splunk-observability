generated: '2026-08-19'
method: searched
source: >-
  npm registry (registry.npmjs.org), PyPI (pypi.org/pypi/<pkg>/json), Maven Central
  (search.maven.org), NuGet (azuresearch-usnc.nuget.org), the Go module proxy
  (proxy.golang.org), the Terraform registry, and the github.com/signalfx +
  github.com/splunk-terraform organizations. Versions and dates read from the registry
  metadata endpoints on 2026-08-19.
note: >-
  Splunk ships two generations of client libraries for Splunk Observability Cloud and they
  must not be read as one shelf. The SignalFx-era metric/ingest libraries (signalfx on PyPI
  and npm, com.signalfx.public on Maven) are DEPRECATED and their repositories say so; the
  current first-party path is the Splunk Distributions of OpenTelemetry plus the SignalFlow
  clients. The control-plane REST API described in openapi/ has no dedicated generated SDK —
  signalfx-go is the closest thing and is the library the Terraform provider is built on.
packages:
  - language: go
    registry: go
    name: github.com/signalfx/signalfx-go
    url: https://pkg.go.dev/github.com/signalfx/signalfx-go
    install: go get github.com/signalfx/signalfx-go
    official: true
    version: v1.63.0
    published: '2026-07-24'
    note: >-
      Go client for the Splunk Observability Cloud REST API (charts, dashboards, detectors,
      integrations, org tokens, SignalFlow). The most complete first-party binding for the
      control-plane API in this repo's openapi/ directory.
  - language: python
    registry: pypi
