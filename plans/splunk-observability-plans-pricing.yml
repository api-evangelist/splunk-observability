generated: '2026-08-19'
method: searched
source: https://www.splunk.com/en_us/products/pricing/observability.html
currency: USD
billing_period: annual
plan_count: 10
note: >-
  Splunk publishes list prices for Splunk Observability Cloud on a public page — unusual for an
  enterprise observability vendor. Pricing is per HOST for the bundles and the infrastructure/APM
  products, and per volume for RUM and Synthetics. None of it is API-metered: there is no API call
  price, no request quota, and no published API overage. An agent calling this API is billed for
  the hosts and sessions it is watching, not for the calls it makes; the only per-call limits are
  the org-token rate limits in rate-limits/splunk-observability-rate-limits.yml.
