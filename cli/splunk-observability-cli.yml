note: >-
  Splunk ships no general-purpose CLI for the Splunk Observability Cloud control-plane API. There
  is no `splunk-o11y` or `signalfx` command that wraps charts, dashboards, detectors or synthetics
  — infrastructure-as-code is expected to go through the Terraform provider
  (splunk-terraform/signalfx, catalogued in packages/) instead. The one first-party CLI that exists
  is narrow: it uploads symbolication artifacts to the RUM backend.
