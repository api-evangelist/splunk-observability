component_changelogs:
  note: >-
    Thirteen versioned OpenTelemetry components keep separate changelogs in the
    github.com/signalfx organization (splunk-otel-collector, splunk-otel-java, splunk-otel-python,
    splunk-otel-js, splunk-otel-go, splunk-otel-dotnet, splunk-otel-android, splunk-otel-ios and
