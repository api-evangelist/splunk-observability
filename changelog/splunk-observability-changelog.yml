generated: '2026-08-19'
method: searched
source: https://help.splunk.com/en/splunk-observability-cloud/release-notes
scheme: rolling-saas-plus-versioned-components
current_version: null
version_note: >-
  Splunk Observability Cloud has no product version number. Splunk states it "comprises both SaaS
  products which release on a rolling basis and downloadable versioned components" — the SaaS
  surface (and therefore the REST API in openapi/) is dated, not versioned, and each
  OpenTelemetry distribution keeps its own semantic version in its own GitHub changelog.
cadence: >-
  Release notes are published monthly with multiple dated entries per month; the archive on
  help.splunk.com runs from October 2024 through August 2026.
format:
  dated: true
  machine_readable: false
  note: >-
    The changelog is HTML only. There is no RSS/Atom feed, no JSON feed and no per-endpoint API
    changelog, so an agent cannot detect a breaking change without re-reading prose.
api_changelog:
  separate: false
  note: >-
    Splunk publishes no dedicated API changelog. The release notes are product-feature notes; the
    48 OpenAPI documents each carry their own info.version (1.0.0 through 5.0.1) and those numbers
    are the only per-API change signal published.
